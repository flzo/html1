<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Amy has a lucky ring.</span>
<span>It is silver</span>
<span>and has a rose on it.</span>
<span>She wears it</span>
<span>when she has a difficult test</span>
<span>coming up.</span>
<span>She wears it</span>
<span>when she plays</span>
<span>against a competitive tennis player.</span>
<span>She wears it</span>
<span>when her parents are mad at her.</span>
<span>She wears it</span>
<span>whenever she needs luck.</span>
