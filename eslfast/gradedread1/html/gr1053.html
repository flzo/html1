<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Cathy likes Eric.</span>
<span>She likes his personality.</span>
<span>He is smart,</span>
<span>funny, kind,</span>
<span>and athletic.</span>
<span>They sit</span>
<span>next to each other</span>
<span>in Spanish class.</span>
<span>Cathy isn't sure</span>
<span>if Eric likes her back.</span>
<span>She decides</span>
<span>to ask him out</span>
<span>on a date</span>
<span>to find out.</span>
<span>Cathy asks Eric</span>
<span>if he would like</span>
<span>to get lunch</span>
<span>on Saturday.</span>
<span>Eric says yes!</span>
