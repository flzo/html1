<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Larry loves American football.</span>
<span>He watches it</span>
<span>every weekend.</span>
<span>Each football game</span>
<span>is about three hours long.</span>
<span>It is exciting</span>
<span>to see players</span>
<span>score touchdowns.</span>
<span>Larry sits</span>
<span>in front of the TV</span>
<span>watching the game.</span>
<span>His dog</span>
<span>sits next to him</span>
<span>while he watches.</span>
<span>The dog falls asleep</span>
<span>on the couch.</span>
