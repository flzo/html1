<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Jeff is going to Denver</span>
<span>to visit his aunt and uncle.</span>
<span>He packs for his flight.</span>
<span>He packs his toothbrush,</span>
<span>phone charger,</span>
<span>headphones,</span>
<span>underwear,</span>
<span>and socks.</span>
<span>These are things</span>
<span>he must have.</span>
<span>He also packs a book,</span>
<span>a deck of cards,</span>
<span>and a pen.</span>
<span>He doesn't really</span>
<span>need these things</span>
<span>but it's nice</span>
<span>to have them.</span>

</p> </div>
