<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Karen and Judy</span>
<span>go to the carnival.</span>
<span>They want</span>
<span>to win some prizes.</span>
<span>They decide</span>
<span>to play the Hoop Toss game.</span>
<span>There are</span>
<span>rows of sticks.</span>
<span>Each person</span>
<span>gets 5 rings.</span>
<span>The goal</span>
<span>is to throw a ring</span>
<span>to land it</span>
<span>on the stick.</span>
<span>If you throw a ring</span>
<span>to a row</span>
<span>that is further</span>
<span>from you,</span>
<span>you get</span>
<span>a better prize.</span>
