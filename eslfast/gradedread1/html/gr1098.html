<span>Brenda is in detention</span>
<span>for the first time.</span>
<span>She is usually</span>
<span>a good student.</span>
<span>She is in detention</span>
<span>because she cheated on a test.</span>
<span>She looked at her notes</span>
<span>during the test</span>
<span>and was caught.</span>
<span>She is required</span>
<span>to write an essay</span>
<span>on why cheating is bad.</span>
<span>Brenda is writing the essay.</span>
<span>She hates being in detention.</span>
