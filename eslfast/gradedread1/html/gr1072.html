<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Patricia</span>
<span>loves reading books.</span>
<span>She likes romance novels.</span>
<span>She likes short stories.</span>
<span>She likes poems.</span>
<span>She likes history books.</span>
<span>She can read quickly.</span>
<span>She reads 3 books</span>
<span>a week.</span>
<span>She doesn't like fantasy</span>
<span>or science fiction novels.</span>
<span>She never reads those</span>
<span>unless she has to.</span>
