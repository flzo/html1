<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Richard</span>
<span>waits at the bus stop.</span>
<span>The bus arrives.</span>
<span>He says hello</span>
<span>to the bus driver,</span>
<span>and puts in</span>
<span>a one-dollar bill.</span>
<span>He takes a seat.</span>
<span>The bus moves</span>
<span>to the next stop.</span>
<span>An elderly woman</span>
<span>gets on the bus.</span>
<span>All the seats</span>
<span>in the front</span>
<span>are taken.</span>
<span>Richard stands up</span>
<span>and offers his seat</span>
<span>to the elderly woman.</span>

</p> </div>
