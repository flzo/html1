<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Judy is not wearing</span>
<span>her sweater</span>
<span>today.</span>
<span>She shivers</span>
<span>in her history class.</span>
<span>She finds it hard</span>
<span>to focus on the lesson.</span>
<span>Her classmate, Nicole,</span>
<span>gives her a sweater.</span>
<span>Judy does not want</span>
<span>to take it.</span>
<span>Nicole tells her</span>
<span>that she always carries</span>
<span>an extra sweater.</span>
<span>Judy thanks her</span>
<span>and put it on.</span>
<span>Now she feels warm.</span>
