<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Barbara buys candy bars</span>
<span>for $1 each.</span>
<span>She brings them</span>
<span>to school.</span>
<span>During lunch time,</span>
<span>she sells them</span>
<span>to her classmates.</span>
<span>She sells them</span>
<span>for $3 each.</span>
<span>Some days,</span>
<span>no one</span>
<span>buys her candy bars.</span>
<span>Other days,</span>
<span>she can sell</span>
<span>20 candy bars.</span>
<span>She earns some money.</span>
<span>She uses the money</span>
<span>to buy things she needs.</span>
