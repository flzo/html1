<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Deborah</span>
<span>is walking back home</span>
<span>from school.</span>
<span>She notices</span>
<span>a tree full of oranges.</span>
<span>She stops</span>
<span>and looks at the tree.</span>
<span>She loves oranges.</span>
<span>The owner of the house</span>
<span>sees Deborah</span>
<span>and asks her to come.</span>
<span>The owner</span>
<span>offers Deborah a bag</span>
<span>and puts 10 oranges </span>
<span>into the bag.</span>
<span>Deborah is excited.</span>
<span>She thanked the owner.</span>
