<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Elizabeth</span>
<span>has a blue ink pen.</span>
<span>In her notebook,</span>
<span>she writes down</span>
<span>a list of things</span>
<span>she needs to do.</span>
<span>Her pen stops working.</span>
<span>She shakes it.</span>
<span>It still does not work.</span>
<span>It is out of ink.</span>
<span>Her classmate Michael</span>
<span>lends her his pen.</span>
<span>She thanks him.</span>
<span>She continues to write</span>
<span>in her notebook.</span>

</p> </div>
