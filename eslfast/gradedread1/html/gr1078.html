<span>Every year</span>
<span>there is</span>
<span>a Halloween parade</span>
<span>at the school.</span>
<span>The students walk around</span>
<span>in their costumes.</span>
<span>Family and friends</span>
<span>are invited.</span>
<span>The parents</span>
<span>take pictures of their kids</span>
<span>in costumes.</span>
<span>Some kids</span>
<span>dress up as royalty.</span>
<span>Some kids</span>
<span>have scary masks on.</span>
<span>Some kids</span>
<span>dress as animals.</span>
<span>Everyone</span>
<span>is having fun.</span>
