<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Kevin is hungry.</span>
<span>He goes to the snack shop.</span>
<span>He sees potato chips.</span>
<span>He doesn't like potato chips</span>
<span>that much.</span>
<span>He sees candy.</span>
<span>He is trying not to eat sweets</span>
<span>to avoid cavities.</span>
<span>He sees a banana.</span>
<span>He likes bananas.</span>
<span>They are healthy.</span>
<span>It's not messy to eat.</span>
<span>He buys a banana</span>
<span>for 25 cents.</span>
