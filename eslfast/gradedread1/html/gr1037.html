<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>William loves his dog.</span>
<span>His parents</span>
<span>got him the dog</span>
<span>when he was 5 years old.</span>
<span>William is now</span>
<span>12 years old.</span>
<span>The dog is very loving.</span>
<span>It always</span>
<span>wags its tail</span>
<span>when it meets people.</span>
<span>The dog likes</span>
<span>to give people licks too.</span>
<span>The dog</span>
<span>is a part of the family.</span>
