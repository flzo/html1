<span>Daniel</span>
<span>is the middle child</span>
<span>in his family.</span>
<span>He has an older sister,</span>
<span> Jennifer,</span>
<span>who is 4 years older</span>
<span>than him.</span>
<span>Jennifer</span>
<span>is a medical student</span>
<span>who lives</span>
<span>in a different state</span>
<span>now.</span>
<span>He has a younger brother,</span>
<span>Paul,</span>
<span>who is 2 years younger</span>
<span>than him.</span>
<span>Daniel feels</span>
<span>that Paul</span>
<span>is like a friend to him.</span>
