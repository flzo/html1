<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Lisa is running fast</span>
<span>on the playground.</span>
<span>She is racing her friend Laura.</span>
<span>Lisa trips on a rock.</span>
<span>She falls down.</span>
<span>There's some blood</span>
<span>on her knee.</span>
<span>It hurts.</span>
<span>Laura stops running.</span>
<span>She gets a teacher to help.</span>
<span>The teacher sits down</span>
<span>on the ground</span>
<span>with Lisa</span>
<span>and puts a bandage</span>
<span>on Lisa's knee.</span>

</p> </div>
