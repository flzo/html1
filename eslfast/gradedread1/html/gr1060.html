<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Steven lives</span>
<span>half a mile</span>
<span>from his school.</span>
<span>It's not a long walk,</span>
<span>but it's a tiring walk.</span>
<span>It's tiring</span>
<span>because the walk</span>
<span>is all uphill.</span>
<span>Steven is always</span>
<span>out of breath</span>
<span>by the time</span>
<span>he gets to school.</span>
<span>He asks his older sister</span>
<span>to drive him to school.</span>
<span>His sister laughs</span>
<span>and calls him lazy.</span>
