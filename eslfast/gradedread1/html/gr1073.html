<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>It is fall season.</span>
<span>During the fall,</span>
<span>tree leaves</span>
<span>change colors.</span>
<span>The leaves</span>
<span>are no longer green.</span>
<span>They turn orange,</span>
<span>yellow,</span>
<span>or red.</span>
<span>The leaves fall down</span>
<span>to the ground.</span>
<span>People rake the leaves.</span>
<span>Kids like to jump</span>
<span>into piles of leaves.</span>
<span>At the end of the fall,</span>
<span>the leaves turn brown</span>
<span>and crunchy.</span>

</p> </div>
