<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Larry rips off a page</span>
<span>from his notebook.</span>
<span>He writes something on it.</span>
<span>He passes it</span>
<span>to the classmate behind him</span>
<span>and asks him to pass it</span>
<span>to Adam.</span>
<span>Adam sits all the way</span>
<span>in the back of the row.</span>
<span>The teacher sees that.</span>
<span>He grabs the note</span>
<span>and rips it,</span>
<span>and throws it</span>
<span>into the trash can.</span>
