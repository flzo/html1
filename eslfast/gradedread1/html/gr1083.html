<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She is donating</span>
<span>some of her clothes.</span>
<span>She has too many.</span>
<span>She goes through</span>
<span>her closet and dresser.</span>
<span>She puts the clothes</span>
<span>in two piles.</span>
<span>The first pile</span>
<span>is clothes she wears</span>
<span>at least once a month.</span>
<span>The second pile</span>
<span>is clothes</span>
<span>she doesn't wear</span>
<span>anymore.</span>
<span>She donates all the clothes</span>
<span>in the second pile.</span>

</p> </div>
