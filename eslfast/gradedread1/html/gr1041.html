<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She goes</span>
<span>to the lake</span>
<span>by her house.</span>
<span>There are many ducks</span>
<span>in the lake.</span>
<span>She sees baby ducks</span>
<span>following their mom.</span>
<span>The ducks</span>
<span>have green heads,</span>
<span>yellow beaks,</span>
<span>and brown feathers.</span>
<span>She throws</span>
<span>some bread crumbs</span>
<span>into the lake.</span>
<span>The ducks</span>
<span>quickly swim over</span>
<span>to eat them.</span>
<span>She throws more bread crumbs</span>
<span>to the ducks.</span>
