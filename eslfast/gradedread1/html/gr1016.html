<span>Lisa is a vegetarian.</span>
<span>She does not eat meat.</span>
<span>She eats vegetables.</span>
<span>She eats rice.</span>
<span>She eats candy.</span>
<span>She eats fruits.</span>
<span>She does not eat chicken.</span>
<span>She does not drink chicken soup.</span>
<span>She does not eat fish.</span>
<span>Lisa doesn't care</span>
<span>if other people eat meat.</span>
<span>She just doesn't think</span>
<span>it tastes good.</span>
