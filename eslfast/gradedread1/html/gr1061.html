<span>The students</span>
<span>go to the playground</span>
<span>during the break.</span>
<span>The break</span>
<span>is 30 minutes.</span>
<span>The playground</span>
<span>is big.</span>
<span>There are swings,</span>
<span>slides,</span>
<span>monkey bars,</span>
<span>basketball courts,</span>
<span>and a running track.</span>
<span>The students</span>
<span>are spread out</span>
<span>across the playground.</span>
<span>Teachers</span>
<span>are on the playground</span>
<span>to make sure</span>
<span>the students are safe.</span>
