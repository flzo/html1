<span>She sees a black spider</span>
<span>on the kitchen floor.</span>
<span>She is scared.</span>
<span>The spider</span>
<span>is not moving.</span>
<span>She asks her dad</span>
<span>to kill the spider.</span>
<span>Her dad doesn't like</span>
<span>killing the spider.</span>
<span>He gets a cup.</span>
<span>He puts the cup</span>
<span>on top of the spider.</span>
<span>The spider</span>
<span>is inside the cup.</span>
<span>Later</span>
<span>her dad</span>
<span>lets the spider out.</span>
