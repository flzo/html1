<span>to a baseball game</span>
<span>with her friend.</span>
<span>They go there early</span>
<span>to avoid the crowd.</span>
<span>They buy</span>
<span>hot dogs and soda.</span>
<span>They sit down.</span>
<span>They watch the baseball players</span>

<span>The baseball game begins,</span>
