<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Anna</span>
<span>needs to put on socks</span>
<span>before she goes to school.</span>
<span>She puts a pink sock</span>
<span>on the left foot.</span>
<span>She cannot find</span>
<span>the other pink sock</span>
<span>for her right foot.</span>
<span>She looks</span>
<span>under her bed.</span>
<span>She cannot find it.</span>
<span>She puts a blue sock</span>
<span>on her right foot.</span>
<span>She hopes</span>
<span>none of her classmates</span>
<span>will notice.</span>

</p> </div>
