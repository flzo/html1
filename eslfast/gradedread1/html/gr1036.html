<span>Dorothy</span>
<span>goes to the lake</span>
<span>by her house.</span>
<span>She likes to sit there</span>
<span>and watch the turtles.</span>
<span>The turtles are small.</span>
<span>They are green.</span>
<span>They are slow.</span>
<span>She likes</span>
<span>to watch their movements.</span>
<span>She wishes</span>
<span>she could</span>
<span>take a turtle home,</span>
<span>but she doesn't want</span>
<span>to take it away</span>
<span>from its family.</span>
