<span>She wants</span>
<span>to make a sandwich</span>
<span>for lunch.</span>
<span>She toasts</span>
<span>two slices of wheat bread.</span>
<span>She spreads mayonnaise</span>
<span>on one piece of bread.</span>
<span>She spreads mustard</span>
<span>on the other piece.</span>
<span>She puts ham,</span>
<span>cheese, lettuce,</span>
<span>tomatoes, onions,</span>
<span>and pickles</span>
<span>on one of the pieces.</span>

<span>the second slice of bread</span>
<span>on top.</span>
