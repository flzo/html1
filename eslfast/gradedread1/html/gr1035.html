<span>Maggie shops online.</span>
<span>She sees a jacket</span>
<span>she likes.</span>
<span>It is yellow</span>
<span>and looks soft.</span>
<span>She usually</span>
<span>gets her clothes</span>
<span>in the size medium.</span>
<span>But medium</span>
<span>is sold out.</span>
<span>The small and large sizes</span>
<span>are available.</span>
<span>She buys the jacket</span>
<span>in the large size.</span>
<span>It might be too big,</span>
<span>but she knows</span>
<span>it will fit.</span>
