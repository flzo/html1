<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She likes to pretend</span>
<span>she is a doctor</span>
<span>for fun.</span>
<span>She wears</span>
<span>a white coat.</span>
<span>She pretends</span>
<span>her room</span>
<span>is a medical office.</span>
<span>Her dad pretends</span>
<span>he is a patient.</span>
<span>Her dad</span>
<span>goes into her room.</span>
<span>He tells her</span>
<span>how he is feeling.</span>
<span>He says</span>
<span>that he keeps coughing.</span>
<span>She tells him</span>
<span>to drink a lot of water.</span>
