<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Kate is walking.</span>
<span>She sees a dog.</span>
<span>The dog</span>
<span>wags its tail.</span>
<span>Kate likes the dog.</span>
<span>It has no collar.</span>
<span>Kate takes it home.</span>
<span>She washes the dog.</span>
<span>She names him</span>
<span>"Toby."</span>
<span>She takes Toby</span>
<span>to the vet.</span>
<span>Toby is healthy.</span>
<span>Kate walks Toby</span>
<span>every day.</span>
<span>They love each other.</span>
