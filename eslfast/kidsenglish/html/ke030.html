<span>Donald is</span>
<span>in the second grade.</span>
<span>His reading level</span>
<span>is not as good</span>
<span>as the other students'.</span>
<span>He wants to improve</span>
<span>his English skills.</span>
<span>He starts</span>
<span>to read more.</span>
<span>He looks up words</span>
<span>he does not know</span>
<span>in the dictionary.</span>
<span>He writes down</span>
<span>what the words mean.</span>
<span>Afterwards,</span>
<span>he reads</span>
<span>the book again.</span>
