<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>It is</span>
<span>break time.</span>
<span>The students</span>
<span>go out to play.</span>
<span>Three friends</span>
<span>play with a jump rope.</span>
<span>Elizabeth</span>
<span>holds one end.</span>
<span>Susan holds</span>
<span>the other end.</span>
<span>They stand apart</span>
<span>from each other.</span>
<span>They swing the rope.</span>
<span>Maria jumps in.</span>
<span>The rope goes</span>
<span>over her head.</span>
<span>She is good.</span>
<span>She keeps jumping</span>
<span>over the rope.</span>

</p> </div>
