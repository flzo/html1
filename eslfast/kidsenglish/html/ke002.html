<span>Dad gives Tim</span>
<span>a toy.</span>
<span>The toy</span>
<span>is in the box.</span>
<span>Tim</span>
<span>takes off</span>
<span>the lid.</span>
<span>He sees the toy.</span>
<span>It is a car.</span>
<span>The car</span>
<span>is red.</span>
<span>The car</span>
<span>makes noises.</span>
<span>The car</span>
<span>moves fast.</span>
<span>Tim likes the gift.</span>
<span>He hugs his dad.</span>
<span>Dad smiles.</span>
