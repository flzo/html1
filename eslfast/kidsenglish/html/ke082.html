<title>82. The Trouble with Braces</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish/ke/ke082.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish/audio/ke082ri14.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He has</span>
<span>bad teeth.</span>
<span>He gets braces.</span>
<span>He goes to school.</span>
<span>He starts to talk.</span>
<span>His classmates</span>
<span>see his braces.</span>
<span>They make fun of him.</span>
<span>He feels sad.</span>
<span>He closes his mouth.</span>
<span>He stops talking.</span>
<span>His teacher</span>
<span>asks him a question.</span>
<span>He decides to talk.</span>
<span>He does not care</span>
<span>if people</span>
<span>make fun of him</span>
<span>anymore.</span>

</p> </div>
