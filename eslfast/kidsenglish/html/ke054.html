<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Two brothers</span>
<span>are bored.</span>
<span>They play catch</span>
<span>with each other</span>
<span>inside the house.</span>
<span>The older brother</span>
<span>throws the ball</span>
<span>to the younger brother.</span>
<span>He catches it.</span>
<span>He throws it back.</span>
<span>The ball</span>
<span>hits the window.</span>
<span>The window breaks.</span>
<span>Their mom</span>
<span>hears the loud sound.</span>
<span>She is mad.</span>
<span>She takes the ball away.</span>
