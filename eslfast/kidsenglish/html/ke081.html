<span>Michelle eats</span>
<span>with her family.</span>
<span>She wants</span>
<span>to eat peas.</span>
<span>She asks her mom,</span>
<span>"Will you please</span>
<span>pass me the peas?"</span>
<span>The mom smiles.</span>
<span>She gives her</span>
<span>the plate.</span>
<span>Michelle gets a gift</span>
<span>from her dad.</span>
<span>She thanks him.</span>
<span>Michelle</span>
<span>sees a classmate cry.</span>
<span>She gives the classmate</span>
<span>a tissue.</span>
<span>Michelle has</span>
<span>really good manners.</span>
