<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He does not like school.</span>
<span>He hates his teachers.</span>
<span>He hates learning.</span>
<span>He hates his classmates.</span>
<span>He picks on them.</span>
<span>He bothers them.</span>
<span>He rips up</span>
<span>their homework.</span>
<span>He steals</span>
<span>their lunch money.</span>
<span>One day,</span>
<span>his teacher</span>
<span>sees him being mean.</span>
<span>She yells at him.</span>
<span>She makes him</span>
<span>say sorry</span>
<span>to his classmates.</span>

</p> </div>
