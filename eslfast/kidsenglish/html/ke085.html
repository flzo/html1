<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He is talking</span>
<span>to his friends.</span>
<span> His cell phone rings.</span>
<span>He answers it.</span>
<span>It is his sister.</span>
<span>She asks</span>
<span>if he could pick her up</span>
<span>at school.</span>
<span>He tells her</span>
<span>to wait.</span>
<span>He gets off the couch.</span>
<span>He tells his friends</span>
<span>to leave.</span>
<span>He drives his car.</span>
<span>He parks</span>
<span>on the street.</span>
<span>His sister</span>
<span>gets in the car.</span>

</p> </div>
