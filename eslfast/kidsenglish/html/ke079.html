<span>She has</span>
<span> bad manners.</span>
<span>She never shows</span>
<span>any respect.</span>
<span>Her mother</span>
<span>buys her a present.</span>
<span>She does not say</span>
<span>thank you.</span>
<span>Her grandparents</span>
<span>come to her house.</span>
<span>She asks them</span>
<span>to leave.</span>

<span>has something she wants.</span>
<span>She steals it.</span>
