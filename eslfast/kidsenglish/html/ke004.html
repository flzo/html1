<span>The kids</span>
<span>are in class.</span>
<span>The teacher</span>
<span>is teaching math.</span>
<span>The kids</span>
<span>are tired.</span>
<span>They want</span>
<span>to play.</span>
<span>They want</span>
<span>to see the sun.</span>
<span>They like slides.</span>
<span>They also</span>
<span>like swings.</span>
<span>They don't like math.</span>
<span>They stare</span>
<span>at the clock.</span>
<span>The clock</span>
<span>moves slowly.</span>
<span>The kids</span>
<span>continue to wait.</span>
