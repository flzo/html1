<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He goes</span>
<span>to a shoe store.</span>
<span>He sees</span>
<span>a pair he likes.</span>
<span>It is</span>
<span>black and white.</span>
<span>He tries it on.</span>
<span>It is too tight.</span>
<span>He asks</span>
<span>if there is</span>
<span>a bigger size.</span>
<span>There is not.</span>
<span>He looks at</span>
<span>the other shoes.</span>
<span>He sees</span>
<span>another pair he likes.</span>
<span>It is bright yellow.</span>
<span>He tries it on.</span>
<span>It fits perfectly.</span>
