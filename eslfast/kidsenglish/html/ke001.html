<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She goes</span>
<span>to the zoo.</span>
<span>She sees a lion.</span>
<span>The lion roars.</span>
<span>She sees an elephant.</span>
<span>The elephant</span>
<span>has a long trunk.</span>
<span>She sees a turtle.</span>
<span>The turtle</span>
<span>is slow.</span>
<span>She sees a rabbit.</span>
<span>The rabbit</span>
<span>has soft fur.</span>
<span>She sees a gorilla.</span>
<span>The gorilla</span>
<span>is eating a banana.</span>

</p> </div>
