<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She eats</span>
<span>a slice of cake.</span>
<span>She drops a crumb.</span>
<span>The ants</span>
<span>can smell it.</span>
<span>They crawl</span>
<span>towards the crumb.</span>
<span>She notices the ants.</span>
<span>She does not want</span>
<span>to kill them.</span>
<span>She gets a cup.</span>
<span>She puts the ants</span>
<span>inside.</span>
<span>She opens the window.</span>
<span>She lets the ants go.</span>
