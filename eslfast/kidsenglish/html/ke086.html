<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>The princess</span>
<span>is stuck in the tower.</span>
<span>A dragon</span>
<span>will eat her soon.</span>
<span>The king and queen</span>
<span>are sad.</span>
<span>They offer</span>
<span>to give money</span>
<span>to the person</span>
<span>who saves her.</span>
<span>They put up posters</span>
<span>around town.</span>
<span>A poor farmer</span>
<span>sees it.</span>
<span>He climbs up the tower.</span>
<span>He gets the princess.</span>
<span>He takes her</span>
<span>to his horse.</span>
<span>They ride back</span>
<span>to town.</span>

</p> </div>
