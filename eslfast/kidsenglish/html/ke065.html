<title>65. A Busy Boy</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish/ke/ke065.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish/audio/ke065py8.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>The boy</span>
<span>is always busy.</span>
<span>He goes to school</span>
<span>for eight hours.</span>
<span>He has seven classes.</span>
<span>They are all hard.</span>
<span>He has</span>
<span>a lot of homework.</span>
<span>It takes him</span>
<span>five hours</span>
<span>to finish it.</span>
<span>He also has</span>
<span>piano practice.</span>
<span>He spends two hours</span>
<span>playing the piano.</span>
<span>He only sleeps</span>
<span>for four hours.</span>
<span>He is tired.</span>

</p> </div>
