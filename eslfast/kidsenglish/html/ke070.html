<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>The boy tries to study</span>
<span>for his quiz tomorrow</span>
<span>His cat</span>
<span>keeps bothering him.</span>
<span>It keeps</span>
<span>pulling his leg.</span>
<span>It keeps</span>
<span>making noises.</span>
<span>He gets</span>
<span>a ball of yarn.</span>
<span>He throws it</span>
<span>across the room.</span>
<span>The cat</span>
<span>chases the ball of yarn.</span>
<span>The cat</span>
<span>catches the yarn.</span>
<span>It plays with it.</span>
<span>The boy can</span>
<span>finally study.</span>
