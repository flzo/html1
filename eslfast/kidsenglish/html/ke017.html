<span>Mark needs a book.</span>
<span>He does not have money.</span>
<span>His mom takes him</span>
<span>to the library.</span>
<span>Mark can borrow books</span>
<span>for free.</span>
<span>Mark enters</span>
<span>the library.</span>
<span>There are</span>
<span>so many books.</span>
<span>There are books</span>
<span>about animals.</span>
<span>There are books</span>
<span>about pirates.</span>
<span>There are books</span>
<span>about science.</span>
<span>Mark borrows them all.</span>
