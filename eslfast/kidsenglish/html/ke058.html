<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>The dog</span>
<span>likes to dig.</span>
<span>It is</span>
<span>his favorite thing</span>
<span>to do.</span>
<span>He goes</span>
<span>into his owner's house.</span>
<span>He takes</span>
<span>a necklace.</span>
<span>He puts the necklace</span>
<span>in his mouth.</span>
<span>He runs</span>
<span>to the backyard.</span>
<span> He digs a hole</span>
<span>with his paws.</span>
<span>He puts the necklace</span>
<span>inside.</span>
<span>He covers the hole</span>
<span>with dirt.</span>
