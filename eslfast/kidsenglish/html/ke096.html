<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Betty and Brian</span>
<span>go to the amusement park.</span>
<span>It is hot and sunny.</span>
<span>They want to cool off.</span>
<span>They see a water slide.</span>
<span>There is</span>
<span>a long line.</span>
<span>Everyone wants</span>
<span>to get wet.</span>
<span>Betty and Brian</span>
<span>finally reach</span>
<span>the front of the line.</span>
<span>They get into</span>
<span>their bathing suits.</span>
<span>They go down the slide.</span>
<span>They are completely wet.</span>
