<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>The roller coaster ride</span>
<span>is fun and fast.</span>
<span>The line</span>
<span>is so long.</span>
<span>John and his friends</span>
<span>decide to wait.</span>
<span>John tries</span>
<span>to find ways</span>
<span>to pass time.</span>
<span>He taps his foot</span>
<span>for ten minutes.</span>
<span>Then,</span>
<span>he plays games</span>
<span>on his phone.</span>
<span>Later,</span>
<span>he tells his friends</span>
<span>jokes.</span>
<span>Two hours pass.</span>
<span>The boys</span>
<span>are still in line.</span>
