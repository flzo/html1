<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She goes out</span>
<span>to play.</span>
<span>She runs around.</span>
<span>She falls down.</span>
<span>It hurts.</span>
<span>She cries.</span>
<span>She gets up.</span>
<span>She goes</span>
<span>to the nurse.</span>
<span>The nurse is nice.</span>
<span>She looks friendly.</span>
<span>The nurse gives her</span>
<span>a lollipop.</span>
<span>It tastes good.</span>
<span>The nurse gives her</span>
<span>a bandage.</span>
<span>She is okay now.</span>
<span>She walks back</span>
<span>to class.</span>

</p> </div>
