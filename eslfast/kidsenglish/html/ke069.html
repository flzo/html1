<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She has one dog</span>
<span>already.</span>
<span>It has black fur.</span>
<span>It is very big.</span>
<span>She wants</span>
<span>another one.</span>
<span>She goes</span>
<span>to the pet store.</span>
<span>She buys</span>
<span>another dog.</span>
<span>It has brown fur.</span>
<span>It is medium-sized.</span>
<span>She brings it home.</span>
<span>She puts her two dogs</span>
<span>together.</span>
<span>They run away</span>
<span>from each other.</span>
<span>They do not like</span>
<span>each other.</span>

</p> </div>
