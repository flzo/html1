</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish/ke/ke015.htm -->

<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Tomorrow</span>
<span>is the first day</span>
<span>of school.</span>
<span>Barbara</span>
<span>looks at her backpack.</span>
<span>It has holes.</span>
<span>It is dirty.</span>
<span>She needs</span>
<span>a new one.</span>
<span>Her mom</span>
<span>takes her shopping.</span>
<span>There are</span>
<span>so many backpacks.</span>
<span>One backpack</span>
<span>has yellow stars.</span>
<span>Another one</span>
<span>has rainbow stripes.</span>
<span>Another one</span>
<span>has dogs.</span>
<span>Barbara</span>
<span>likes this one.</span>
<span>She buys it.</span>

</p> </div>
