<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She has a pencil.</span>
<span>It is</span>
<span>four inches long.</span>
<span>It is</span>
<span>shiny and pink.</span>
<span>It has an eraser</span>
<span>on one end.</span>
<span>It even has</span>
<span>her name on it.</span>
<span>She uses her pencil</span>
<span>for everything.</span>
<span>She uses it</span>
<span>to write letters.</span>
<span>She uses it</span>
<span>to do her homework.</span>
<span>She uses it</span>
<span>on her tests.</span>

</p> </div>
