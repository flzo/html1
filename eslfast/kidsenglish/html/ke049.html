<title>49. Hide and Seek</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish/ke/ke049.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish/audio/ke049co3.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>John covers</span>
<span>his eyes.</span>
<span>Sandra</span>
<span>finds a place</span>
<span>to hide.</span>
<span>John</span>
<span>counts to ten.</span>
<span>At "ten,"</span>
<span>he opens his eyes.</span>
<span>He tries</span>
<span>to find Sandra.</span>
<span>He walks</span>
<span>around their room.</span>
<span>He checks the kitchen.</span>
<span>He checks</span>
<span>under the bed.</span>
<span>He checks</span>
<span>the laundry room.</span>
<span>He does not find her yet.</span>
<span>Sandra is</span>
<span>in their parents' room.</span>

</p> </div>
