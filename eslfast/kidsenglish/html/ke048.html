<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He wants</span>
<span>to get something</span>
<span>for his teacher.</span>
<span>He has no money</span>
<span>though.</span>
<span>He gets creative.</span>
<span>He goes</span>
<span>to his backyard.</span>
<span>He looks at</span>
<span>his rose bush.</span>
<span>He cuts</span>
<span>a nice,</span>
<span>red one.</span>
<span>He puts it</span>
<span>in a vase.</span>
<span>He pours some water</span>
<span>in the vase.</span>
<span>His gift</span>
<span>is complete.</span> 

</p> </div>
