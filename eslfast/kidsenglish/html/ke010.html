<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>It is</span>
<span>Lily's birthday.</span>
<span>She gets</span>
<span>out of bed.</span>
<span>Nobody says anything</span>
<span>to her.</span>
<span>Her mom</span>
<span>takes her</span>
<span>to school.</span>
<span>Her friends</span>
<span>do not say anything.</span>
<span>The teacher</span>
<span>does not say anything.</span>
<span>Lily is sad.</span>
<span>Lily walks home</span>
<span>alone.</span>
<span>She opens the door.</span>
<span>Her friends and family</span>
<span> are holding a cake.</span>
<span>They say,</span>
<span>"Surprise Lily!"</span>
