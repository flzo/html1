<span>He is</span>
<span>playing video games.</span>
<span>Mom gets mad.</span>
<span>She thinks</span>
<span>he is lazy.</span>
<span>She gives him</span>
<span>a list of chores.</span>
<span>He frowns.</span>
<span>He looks</span>
<span>at the list.</span>
<span>He has to</span>
<span>clean the floors.</span>
<span>Then,</span>
<span>he has to wash the dishes.</span>
<span>Finally,</span>
<span>he has to</span>
<span>feed the dog.</span>
<span>He starts</span>
<span>doing his chores.</span>
