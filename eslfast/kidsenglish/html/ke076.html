<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Her dad</span>
<span>is lonely.</span>
<span>He lives</span>
<span>in a big house</span>
<span>with no one.</span>
<span>He is divorced.</span>
<span>His friends</span>
<span>live far away.</span>
<span>He does not work</span>
<span>anymore.</span>
<span>He just sits</span>
<span>at home</span>
<span>and watches movies.</span>
<span>She feels bad</span>
<span>for her dad.</span>
<span>She surprises him</span>
<span>with a dog.</span>
<span>He loves the dog</span>
<span>so much.</span>
<span>He takes care of it.</span>
