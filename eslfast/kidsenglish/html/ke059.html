<title>59. Playing with the Monkey Bars</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish/ke/ke059.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish/audio/ke059ted2.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She likes the monkey bars.</span>
<span>She grabs the first bar</span>
<span>with both hands.</span>
<span>Her legs are swinging</span>
<span>from the ground.</span>
<span>She puts her right hand</span>
<span>on the second bar.</span>
<span>She then</span>
<span>puts her left hand</span>
<span>on the second bar.</span>
<span>She continues</span>
<span>doing this.</span>
<span>She reaches</span>
<span>the last bar.</span>
<span>She jumps down.</span>
<span>She starts over again</span>
<span>for fun.</span> 

</p> </div>
