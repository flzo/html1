<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He works</span>
<span>at a fast-food restaurant.</span>
<span>He hates his job.</span>
<span>He flips burgers.</span>
<span>He cuts potatoes.</span>
<span>He pours soda</span>
<span>in cups.</span>
<span>He thinks</span>
<span>doing these things</span>
<span>is boring.</span>
<span>He does not like</span>
<span>talking to customers.</span>
<span>His boss,</span>
<span>Susan Wright,</span>
<span>is mean.</span>
<span>She always makes him</span>
<span>work extra hours.</span>
<span>He finally</span>
<span>quits his job.</span>
