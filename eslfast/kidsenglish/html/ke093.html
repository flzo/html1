<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She walks</span>
<span>across the street.</span>
<span>She has four boxes</span>
<span>in her hand.</span>
<span>They are very heavy.</span>
<span>She falls down.</span>
<span>She drops the boxes.</span>
<span>A stranger helps her.</span>
<span>He asks</span>
<span>if she is okay.</span>
<span>She nods her head.</span>
<span>He picks up</span>
<span>her boxes.</span>
<span>He carries them</span>
<span>to her car.</span>
<span>She says thank you.</span>

</p> </div>
