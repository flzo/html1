<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He loves Thanksgiving.</span>
<span>He looks at his calendar.</span>
<span> He gets out his pen.</span>
<span>He crosses out the days</span>
<span>that have passed.</span>
<span>He puts an "X"</span>
<span>through them.</span>
<span>There are only</span>
<span>two more days</span>
<span>until Thanksgiving.</span>
<span>He is so happy.</span>
<span>He is excited</span>
<span>to eat turkey.</span>
<span>He is excited</span>
<span>to see his entire family.</span>
