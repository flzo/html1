<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>The teacher announces</span>
<span>that there is a test.</span>
<span>The students</span>
<span>clear off their desks.</span>
<span>The teacher</span>
<span>passes out the tests.</span>
<span>A student</span>
<span>takes a deep breath.</span>
<span>He takes out</span>
<span>his pencil.</span>
<span>He looks at the questions.</span>
<span>He knows the answers.</span>
<span>He writes them down.</span>
<span>He finishes the test.</span>
<span>He feels good.</span>

</p> </div>
