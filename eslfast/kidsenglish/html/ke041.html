<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He is fat.</span>
<span>He only eats</span>
<span>red meat,</span>
<span>chips,</span>
<span>and candy.</span>
<span>His parents</span>
<span>worry about him.</span>
<span>They ban him</span>
<span>from eating</span>
<span>fattening foods.</span>
<span>They cook healthy meals</span>
<span>only from now on.</span>
<span>They eat oatmeal</span>
<span>for breakfast.</span>
<span>They eat fish,</span>
<span>carrots,</span>
<span>and vegetables</span>
<span>for lunch.</span>
<span>They eat chicken</span>
<span>and salad</span>
<span>for dinner.</span>
