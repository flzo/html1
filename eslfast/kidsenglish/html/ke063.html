<span>A kangaroo is</span>
<span>an interesting animal.</span>
<span>It has a pouch.</span>
<span>A kangaroo's baby</span>
<span>goes into the pouch.</span>
<span>It is safe</span>
<span>there.</span>
<span>James would like</span>
<span>to have a pouch.</span>
<span>He would not</span>
<span>put a baby</span>
<span>in there.</span>
<span>He would</span>
<span>put food and video games</span>
<span>inside.</span>
<span>People and kangaroos</span>
<span>are different.</span>
