<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Dorothy has a diary.</span>
<span>It has a pink cover.</span>
<span>It is four inches</span>
<span>in length.</span>
<span>It is three inches</span>
<span>in width.</span>
<span>It has 200 pages.</span>
<span>There are lines</span>
<span>on the pages.</span>
<span>She writes in it</span>
<span>every day.</span>
<span>She writes about</span>
<span>how she is feeling.</span>
<span>She writes about</span>
<span>what happened in school.</span>
<span>Sometimes,</span>
<span>she draws in her diary.</span>
