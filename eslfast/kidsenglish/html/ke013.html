<title>13. A Cat and A Mouse</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish/ke/ke013.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish/audio/ke013.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>The cat</span>
<span>is bored.</span>
<span>He tries</span>
<span>to have fun.</span>
<span>He plays</span>
<span>with yarn.</span>
<span>He scratches</span>
<span>his tummy.</span>
<span>He takes a nap.</span>
<span>He drinks milk.</span>
<span>He is still bored.</span>
<span>He sees a mouse.</span>
<span>The mouse</span>
<span>is eating cheese.</span>
<span>The cat</span>
<span>steals the cheese.</span>
<span>The mouse</span>
<span>is angry.</span>
<span>The mouse</span>
<span>chases the cat.</span>
<span>The cat</span>
<span>is having fun.</span>

</p> </div> 
</body>
</html>
