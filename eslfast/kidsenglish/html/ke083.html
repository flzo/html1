<span>It is the first day</span>
<span>of high school.</span>
<span>She is</span>
<span>completely lost.</span>
<span>She has</span>
<span>never been here</span>
<span>before.</span>
<span>Her first class</span>
<span>is Spanish.</span>
<span>The class is</span>
<span>in the A building.</span>
<span>A staff member</span>
<span>sees her wandering around.</span>
<span>He gives her</span>
<span>a map.</span>
<span>She looks at it.</span>
<span>She finds her</span>
<span>Spanish class.</span>
