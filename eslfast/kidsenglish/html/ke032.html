<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>It is</span>
<span>a sunny day.</span>
<span>She feels hot.</span>
<span>She fans herself</span>
<span>with a book.</span>
<span>It is still hot.</span>
<span>She turns on</span>
<span>the air conditioner.</span>
<span>It is still hot.</span>
<span>She jumps</span>
<span>into a pool.</span>
<span>It is still hot.</span>
<span>Her dad</span>
<span>has an idea!</span>
<span>He takes her</span>
<span>to the ice cream shop.</span>
<span>They share</span>
<span>a banana split.</span>
<span>She does not feel hot</span>
<span>anymore.</span>
