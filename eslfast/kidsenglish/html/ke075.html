<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>The teacher</span>
<span>is talking about</span>
<span>U.S. government.</span>
<span>She thinks</span>
<span>it is boring.</span>
<span>She stares</span>
<span>at her desk.</span>
<span>She starts</span>
<span>to daydream.</span>
<span>She dreams</span>
<span>about her friends.</span>
<span>They invite her</span>
<span>to a party.</span>
<span>The party is fun.</span>
<span>She dances</span>
<span>and sings.</span>
<span>She listens</span>
<span>to good music.</span>
<span>The teacher</span>
<span>wakes her up.</span>

</p> </div>
