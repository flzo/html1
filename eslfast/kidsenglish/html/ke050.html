<title>50. Excited for the Mail</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish/ke/ke050.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish/audio/ke050.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>The boy waits</span>
<span>for the mailman.</span>
<span>A package</span>
<span>is supposed to come</span>
<span>today.</span>
<span>He sits</span>
<span>by the window.</span>
<span>He sees the mailman</span>
<span>walking.</span>
<span>He goes outside.</span>
<span>He says hello</span>
<span>to the mailman.</span>
<span>The mailman</span>
<span>gives him the package.</span>
<span>They say good-bye</span>
<span>to each other.</span>
<span>The boy goes back</span>
<span>to his house.</span>

</p> </div>
