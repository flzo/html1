<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She sits</span>
<span>in the car.</span>
<span>Her dad</span>
<span>turns on</span>
<span>the radio.</span>
<span>A song plays.</span>
<span>She taps her feet.</span>
<span>She sways her head.</span>
<span>Her dad</span>
<span>laughs at her.</span>
<span>He likes the song</span>
<span>too.</span>
<span>The song</span>
<span>is over.</span>
<span>The radio</span>
<span>plays a different song.</span>
<span>She does not like</span>
<span>the new song.</span>
<span>She sits</span>
<span>quietly.</span>
