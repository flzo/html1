<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Mr. Brown's lectures</span>
<span>are boring.</span>
<span>A student</span>
<span>looks up at Mr. Brown</span>
<span>to check what he is doing.</span>
<span>Mr. Brown</span>
<span>is writing something</span>
<span>on the board.</span>
<span>The student</span>
<span>takes out his phone.</span>
<span>He starts</span>
<span>playing games.</span>
<span>Mr. Brown walks over</span>
<span>to his desk.</span>
<span>Mr. Brown</span>
<span>takes the student's phone away.</span>
<span>He is in trouble.</span>

</p> </div>
