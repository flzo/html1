<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Robert's room</span>
<span>is messy.</span>
<span>There is pizza</span>
<span>under his bed.</span>
<span>There is glue</span>
<span>on the wall.</span>
<span>There is</span>
<span>a pile of clothes.</span>
<span>There are toys</span>
<span>on the floor.</span>
<span>Robert</span>
<span>does not care.</span>
<span>He watches</span>
<span>a television show.</span>
<span>His mom</span>
<span>goes into his room.</span>
<span>She turns off</span>
<span>the television.</span>
<span>She yells</span>
<span>at him.</span>
<span>He starts</span>
<span>to clean his room.</span>
