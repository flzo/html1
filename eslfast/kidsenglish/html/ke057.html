<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He goes outside.</span>
<span>He sees</span>
<span>a ladybug.</span>
<span>The ladybug is red.</span>
<span>It has</span>
<span>black spots too.</span>
<span>t has</span>
<span>six legs.</span>
<span>It has</span>
<span>two wings.</span>
<span>It is small.</span>
<span>He puts the ladybug</span>
<span>on his finger.</span>
<span>It tickles!</span>
<span>The ladybug crawls</span>
<span>all over him.</span>
<span>He wants</span>
<span>to keep it.</span>
<span>The ladybug flies away.</span>
<span>He tries</span>
<span>to catch it.</span>
