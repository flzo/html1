<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She gets an allowance</span>
<span>from her parents.</span>
<span>They give her</span>
<span>$10 a week.</span>
<span>She wants more.</span>
<span>She asks her parents</span>
<span>nicely.</span>
<span>They say no.</span>
<span>She tries</span>
<span>to change their minds.</span>
<span>She washes</span>
<span>their cars.</span>
<span>She makes them</span>
<span>dinner.</span>
<span>She compliments them.</span>
<span>Her parents decide</span>
<span>to give her</span>
<span>a raise.</span>
<span>She will get </span>
<span>$15 a week.</span>
