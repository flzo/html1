<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He has a pet.</span>
<span>It is a rabbit.</span>
<span>His rabbit's name</span>
<span>is Fluffy.</span>
<span>Fluffy is female.</span>
<span>She is white.</span>
<span>She has</span>
<span>black eyes.</span>
<span>She is</span>
<span>very soft.</span>
<span>She is playful.</span>
<span>She weighs</span>
<span>seven pounds.</span>
<span>She likes to hop</span>
<span>around the house.</span>
<span>She likes</span>
<span>to eat carrots.</span>
<span>He gives Fluffy</span>
<span>five carrots a day.</span>
