<title>39. No One Likes the Flu</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish/ke/ke039.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish/audio/ke039o35.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He is sick.</span>
<span>He goes</span>
<span>to the doctor.</span>
<span>The doctor</span>
<span>gives him</span>
<span>some medicine.</span>
<span>He is still sick</span>
<span>after one week.</span>
<span>His mom</span>
<span>tells him</span>
<span>to go to sleep.</span>
<span>He lies in bed</span>
<span>all day.</span>
<span>He rests.</span>
<span>He drinks</span>
<span>chicken soup</span>
<span>and eats vegetables.</span>
<span> He is still sick.</span>
<span>No one</span>
<span>likes the flu.</span>

</p> </div>
