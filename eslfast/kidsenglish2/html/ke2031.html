<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>There is a big sale!</span>
<span>Everything is 50% off.</span>
<span>He likes the expensive watch.</span>
<span>The original price is $100.</span>
<span>The watch is now $50.</span>
<span>He can afford it now.</span>
<span>There is only one left.</span>
<span>Someone else buys it</span>
<span>before him.</span>
<span>He is sad.</span>
<span>He tries</span>
<span>to find a similar watch.</span>
<span>He cannot find one.</span>

</p> </div>
