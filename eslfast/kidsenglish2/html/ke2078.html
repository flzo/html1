<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She goes</span>
<span>to the newsstand.</span>
<span>She wants</span>
<span>to buy a newspaper.</span>
<span>She wants to know</span>
<span>what is going on.</span>
<span>She buys the newspaper</span>
<span>for the week.</span>
<span>She reads the cover story</span>
<span>first.</span>
<span>It is about a murderer</span>
<span>on the loose.</span>
<span>It is scary.</span>
<span>She looks at the cartoons.</span>
<span>It is funny.</span>
