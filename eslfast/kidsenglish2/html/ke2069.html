<title>69. Taking Out the Trash</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish2/ke2/ke2069.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish2/audio/ke2069t.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She smells something bad.</span>
<span>It's the trash can.</span>
<span>It is completely filled.</span>
<span>The bad smell</span>
<span>is coming from the rotten food.</span>
<span>There are black bananas</span>
<span>and spoiled milk inside.</span>
<span>She holds her breath.</span>
<span>She pulls out the trash bag.</span>
<span>She ties it.</span>
<span>She puts it</span>
<span>in a new trash bag.</span>

</p> </div>
