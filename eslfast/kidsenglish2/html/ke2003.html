<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Harry thinks</span>
<span>his grades</span>
<span>are very important.</span>
<span>He studies a lot.</span>
<span>He studies</span>
<span>everywhere he goes.</span>
<span>He studies</span>
<span>at the library.</span>
<span>He studies</span>
<span>when he goes out to eat.</span>
<span>He even studies</span>
<span>when he goes to parties!</span>
<span>His friends</span>
<span>make fun of him.</span>
<span>Harry does not care.</span>
<span>He gets As</span>
<span>all the time.</span>

</p> </div>
