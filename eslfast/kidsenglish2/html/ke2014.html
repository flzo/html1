<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She has a lunch bag.</span>
<span>It has two pockets.</span>
<span>There is one on top.</span>
<span>That is the big pocket.</span>
<span>She puts a sandwich inside.</span>
<span>There is another one</span>
<span>in the front.</span>
<span>That is the small pocket.</span>
<span>She puts a pack of gum inside.</span>
<span>There is a long strap too.</span>
<span>She can put it</span>
<span>over her shoulder.</span>

</p> </div>
