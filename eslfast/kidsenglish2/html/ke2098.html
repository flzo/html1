<title>98. The Mean Guy</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish2/ke2/ke2098.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish2/audio/ke2098r.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He is a mean guy.</span>
<span>He teases people.</span>
<span>He calls people fat.</span>
<span>He sends mean messages</span>
<span>to his classmates.</span>
<span>He trips people</span>
<span>in the hallway.</span>
<span>He cheats</span>
<span>on all his tests.</span>
<span>He steals people's money.</span>
<span>He never pays attention</span>
<span>to his teachers.</span>
<span>Teachers do not want him</span>
<span>in their classes.</span>

</p> </div>
