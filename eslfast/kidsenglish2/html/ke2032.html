<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She has a warm jacket.</span>
<span>It is red.</span>
<span>It is shiny</span>
<span>on the outside.</span>
<span>It is fuzzy</span>
<span>on the inside.</span>
<span>It is not too tight.</span>
<span>It is not too loose.</span>
<span>It has two big pockets</span>
<span>on the side.</span>
<span>She likes</span>
<span>to put snacks inside.</span>
<span>The zipper is colorful.</span>
<span>There is a front pocket.</span>
<span>She puts two pens inside.</span>

</p> </div>
