<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She brings the item</span>
<span>to the cash register.</span>
<span>It costs $40.01.</span>
<span>She looks in her wallet.</span>
<span>She only has $40.</span>
<span>She asks the cashier</span>
<span>if it is okay.</span>
<span>The cashier rudely says no.</span>
<span>She looks at the floor.</span>
<span>There must be a penny</span>
<span>somewhere.</span>
<span>A stranger taps her shoulder.</span>
<span>He asks,</span>
<span>"Need a penny?"</span>

</p> </div>
