<title>43. A White Dog</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish2/ke2/ke2043.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish2/audio/ke2043d.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She has a dog.</span>
<span>It is white.</span>
<span>It has short legs.</span>
<span>It has pointy ears.</span>
<span>It runs very fast.</span>
<span>She plays with the dog.</span>
<span>She throws a toy</span>
<span>across the room.</span>
<span>She tells the dog</span>
<span>to go get it.</span>
<span>The dog runs.</span>
<span>She watches it.</span>
<span>The dog</span>
<span>runs back to her.</span>
<span>The toy is</span>
<span>in the dog's mouth.</span>

</p> </div>
