<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She needs</span>
<span>to get new clothes.</span>
<span>She does not fit</span>
<span>into her old clothes anymore.</span>
<span>She goes to the mall.</span>
<span>She buys some dresses.</span>
<span>She buys some skirts.</span>
<span>She buys some jackets.</span>
<span>She buys some pants.</span>
<span>She buys some shirts.</span>
 <span>She has a lot of shopping bags.</span>
<span>She can't wait</span>
<span>to wear her new clothes.</span>

</p> </div>
