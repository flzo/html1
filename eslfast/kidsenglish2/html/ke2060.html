<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Kate looks at the magazine.</span>
<span>The magazine cover</span>
<span>has a pretty girl.</span>
<span>She has long hair.</span>
<span>She has big,</span>
<span>blue eyes.</span>
<span>Her skin looks nice.</span>
<span>She is a fashion model.</span>
<span>Kate opens up the magazine.</span>
<span>She flips to pages</span>
<span>where the model is.</span>
<span>She reads about the model.</span>
<span>She wishes</span>
<span>she could be her.</span>

</p> </div>
