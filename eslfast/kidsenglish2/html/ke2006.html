<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He gets ready</span>
<span>to study</span>
<span>at the library.</span>
<span> He puts his science textbook</span>
<span>in his backpack.</span>
<span>He puts his pencils and pens</span>
<span>in his backpack.</span>
<span>He puts an eraser</span>
<span>in his backpack.</span>
<span>He puts a snack</span>
<span>in his backpack.</span>
<span>He might get hungry.</span>
<span>He puts a notebook</span>
<span>in his backpack.</span>
<span>He is ready</span>
<span>to study!</span>

</p> </div>
