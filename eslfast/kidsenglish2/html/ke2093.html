<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He worries a lot.</span>
<span>He thinks a lot</span>
<span>about the future.</span>
<span>He worries about</span>
<span>who he is going to marry.</span>
<span>He does not want</span>
<span>to end up with a bad wife.</span>
<span>He worries</span>
<span>that he will not get a job.</span>
<span>He does not want</span>
<span>to be homeless.</span>
<span>He worries</span>
<span>that his friends</span>
<span>will leave him.</span>
<span>He does not want</span>
<span>to be lonely.</span>

</p> </div>
