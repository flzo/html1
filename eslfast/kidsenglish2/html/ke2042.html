<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>You cannot kill a person.</span>
<span>That is against the law.</span>
<span>You will go to jail.</span>
<span>You cannot kill</span>
<span>someone else's dog.</span>
<span>That is against the law, too.</span>
<span>You can kill an ant.</span>
<span>No one likes ants.</span>
<span>Ants eat your food.</span>
<span>Ants invade your house.</span>
<span>Killing ants</span>
<span>is not against the law.</span>

</p> </div>
