<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She has a big dog.</span>
<span>It is a German Shepherd.</span>
<span>She loves her dog.</span>
<span>She walks it around town.</span>
<span>Strangers always</span>
<span>go up to her dog.</span>
<span>They pet it.</span>
<span>They pet it without asking.</span>
<span>She gets mad.</span>
<span>She does not like people</span>
<span>touching her dog.</span>
<span>She pulls her dog</span>
<span>away from people.</span>

</p> </div>
