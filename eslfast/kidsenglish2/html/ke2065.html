<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She has an ugly shirt.</span>
<span>It is her good luck charm.</span>
<span>When she wears it,</span>
<span>good things happen.</span>
<span>She likes to wear it</span>
<span>when something important</span>
<span>is happening.</span>
<span>She wears it on days</span>
<span>when she has tests.</span>
<span>She wears it</span>
<span>when she wants</span>
<span>to impress someone.</span>
<span>She wears it</span>
<span>when she is feeling sad.</span>

</p> </div>
