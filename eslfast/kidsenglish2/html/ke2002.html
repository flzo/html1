<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She is a teacher.</span>
<span>She teaches third graders.</span>
<span>She says</span>
<span>"good morning"</span>
<span>every day.</span>
<span>She asks her students</span>
<span>how they are doing.</span>
<span>The students love her.</span>
<span>She is good</span>
<span>at her job.</span>
<span>She does not get</span>
<span>a lot of money.</span>
<span>Teachers should get more money.</span>
<span>They work so hard.</span>

</p> </div>
