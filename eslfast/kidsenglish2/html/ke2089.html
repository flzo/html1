<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She is now 18.</span>
<span>She can do a lot now.</span>
<span>She can buy cigarettes.</span>
<span>Cigarettes are bad</span>
<span>for you though.</span>
<span>She can work full-time.</span>
<span>She throws a party</span>
<span>for herself.</span>
<span>A lot of people come.</span>
<span>She gets a lot of gifts.</span>
<span>Her cousin gives her</span>
<span>a pack of cigarettes.</span>
<span>She says</span>
<span>she does not want it.</span>
