<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>People think</span>
<span>his boots are ugly.</span>
<span>They are brown.</span>
<span>They have yellow spots.</span>
<span>He does not care</span>
<span>what other people think.</span>
<span>He loves his boots.</span>
<span>He thinks</span>
<span>that they are unique.</span>
<span>Other boots</span>
<span>are too plain for him.</span>
<span>The yellow spots</span>
<span>make the boots special.</span>
<span>His mom tells him</span>
<span>to get new boots.</span>
<span>He says no.</span>

</p> </div>
