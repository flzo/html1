<title>34. Taking the Toy Everywhere</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish2/ke2/ke2034.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish2/audio/ke2034t.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He has a toy.</span>
<span>He plays with the toy.</span>
<span>He takes the toy everywhere.</span>
<span>He takes it to school.</span>
<span>During recess,</span>
<span>he takes it</span>
<span>out of his backpack</span>
<span>and plays with it.</span>
<span>He takes it</span>
<span>when he goes out to eat.</span>
<span>He takes it</span>
<span>when he goes</span>
<span>to swim practice.</span>
<span>He wants to swim</span>
<span>with his toy.</span>
<span>His swim coach</span>
<span>did not let him.</span>

</p> </div>
