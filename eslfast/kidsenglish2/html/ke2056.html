<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He goes</span>
<span>to the movie theater.</span>
<span>He sits down.</span>
<span>He puts his feet up.</span>
<span>He looks around.</span>
<span>He eats his popcorn loudly.</span>
<span>He uses his phone.</span>
<span>He calls someone.</span>
<span>He is talking loudly.</span>
<span>He bothers everyone.</span>
<span>The other moviegoers are mad.</span>
<span>They tell him</span>
<span>to get out.</span>
