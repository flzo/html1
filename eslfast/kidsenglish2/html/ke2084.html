<title>84. He Makes Tea</title>
</head>

<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He pours water</span>
<span>in a pot.</span>
<span>He puts the pot</span>
<span>on the stove.</span>
<span>He turns up the heat.</span>
<span>He waits</span>
<span>for five minutes.</span>
<span>The water</span>
<span>is boiling hot.</span>
<span>He pours the water</span>
<span>into a mug.</span>
<span>He puts a tea packet inside.</span>
<span>The liquid turns green.</span>
<span>He puts some honey inside.</span>
<span>He mixes it</span>
<span>with a spoon.</span>

</p> </div>
