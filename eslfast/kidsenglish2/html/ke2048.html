<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He wants to work</span>
<span>at a shoe store.</span>
<span>He prints out</span>
<span>his job application.</span>
<span>There are</span>
<span>three sheets of paper.</span>
<span>He goes to the shoe store.</span>
<span>He hands the sheets</span>
<span>to the manager.</span>
<span>The manager tells him</span>
<span>to staple the sheets.</span>
<span>He does not have a stapler.</span>
<span>He finds a paper clip</span>
<span>on the floor.</span>
<span>He uses it.</span>

</p> </div>
