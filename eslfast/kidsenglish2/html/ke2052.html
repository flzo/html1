<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Sarah has to do certain things</span>
<span>before she sleeps.</span>
<span>She has to light up candles.</span>
<span>The smell</span>
<span>helps her sleep better.</span>
<span>She has to change</span>
<span>into her pajamas.</span>
<span>Pajamas are more comfortable.</span>
<span>She has to read a story</span>
<span>for ten minutes.</span>
<span>Reading makes her sleepy.</span>
<span>After all that,</span>
<span>she can sleep.</span>

</p> </div>
