<title>73. Performing for Money</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish2/ke2/ke2073.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish2/audio/ke2073t.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He is homeless,</span>
<span>but he can sing well.</span>
<span>He takes off his cap.</span>
<span>He puts it on the floor.</span>
<span>He starts singing.</span>
<span>People like his voice.</span>
<span>They stop and listen.</span>
<span>People put money</span>
<span>in the cap.</span>
<span>He thanks them.</span>
<span>He sings for two hours.</span>
<span>There is $50</span>
<span>in his cap.</span>

</p> </div>
