</head>
<body>

<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Jason blows a balloon.</span>
<span>He wants to give it</span>
<span>to his mom.</span>
<span>Larry pops it</span>
<span>with a pen.</span>
<span>The sound scares Jason.</span>
<span>Jason screams.</span>
<span>He is mad at Larry.</span>
<span>Larry laughs.</span>
<span>Jason punches Larry.</span>
<span>Larry falls down.</span>
<span>Jason laughs.</span>
<span>Larry gets up</span>
<span>and punches Jason.</span>
<span>The two get in trouble</span>
<span>for fighting.</span>

</p> </div>
