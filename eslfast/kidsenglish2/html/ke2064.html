<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She is lonely.</span>
<span>She does everything alone.</span>
<span>She watches TV by herself.</span>
<span>She does not even like watching TV</span>
<span>with her family.</span>
<span>She even eats alone</span>
<span>at restaurants.</span>
<span>She is on her school's basketball team.</span>
<span>She does not talk</span>
<span>to the other players.</span>
<span>She just plays the game.</span>

</p> </div>
