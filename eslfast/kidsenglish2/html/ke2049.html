<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She is 16 years old.</span>
<span>She can get a job now.</span>
<span>She wants to work</span>
<span>at her favorite restaurant.</span>
<span>She can get discounts</span>
<span>if she works there.</span>
<span>She calls them.</span>
<span>She talks to the manager.</span>
<span>The manager invites her</span>
<span>for an interview.</span>
<span>She tells him about herself.</span>
<span>The manager says</span>
<span>he will call her next week.</span>

</p> </div>
