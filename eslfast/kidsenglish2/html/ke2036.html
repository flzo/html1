<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He puts his headphones in.</span>
<span>His headphones</span>
<span>block out all the noise.</span>
<span>He picks his favorite song.</span>
<span>It is a rap song.</span>
<span>He dances along to the song.</span>
<span>He dreams of</span>
<span>becoming a professional dancer.</span>
<span>He wants</span>
<span>to be a backup dancer</span>
<span>for famous rappers.</span>
<span>He practices</span>
<span>every single day.</span>
