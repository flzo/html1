<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She likes sour stuff.</span>
<span>Lemons are sour.</span>
<span>Lemons are yellow.</span>
<span>She peels the skin</span>
<span>off the lemon.</span>
<span>She bites into the lemon.</span>
<span>It tastes good.</span>
<span>She spits out the seeds.</span>
<span>The seeds are not good.</span>
<span>Her mom says</span>
<span>she is weird.</span>
<span>Most people eat lemon</span>
<span>with another food.</span>

</p> </div>
