<span>It is a dance competition.</span>
<span>It is an annual competition.</span>
<span>Winners get a trophy and money.</span>
<span>The dancers perform together</span>
<span>on stage.</span>
<span>They perform a dance</span>
<span>to a song.</span>
<span>They chose a hip-hop song.</span>
<span>There are a lot of dance steps.</span>
<span>It is hard</span>
<span>to memorize them all.</span>
