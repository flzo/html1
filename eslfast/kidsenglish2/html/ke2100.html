<span>She is moving</span>
<span>to another state.</span>
<span>She is excited.</span>
<span>She is also sad.</span>
<span>She is excited</span>
<span>to be in a new place.</span>
<span>She is excited</span>
<span>to meet new people.</span>
<span>She is excited</span>
<span>to start a new life.</span>
<span>She is sad</span>
<span> to leave her family.</span>
<span>She is sad</span>
<span>to leave her friends.</span>
<span>She will miss</span>
<span>a lot of things.</span>
