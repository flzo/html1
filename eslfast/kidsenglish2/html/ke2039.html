<title>39. Keith and John Are Both Crying</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish2/ke2/ke2039.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish2/audio/ke2039e.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Keith hits John.</span>
<span>John falls back.</span>
<span>John cries.</span>
<span>Keith laughs.</span>
<span>John finds a teacher.</span>
<span>He tells the teacher</span>
<span>what Keith did.</span>
<span>The teacher yells at Keith.</span>
<span>Keith cries.</span>
<span>Keith and John</span>
<span>are both crying.</span>
<span>Other kids</span>
<span>laugh at them.</span>
<span>Keith and John</span>
<span>cry even more.</span>
<span>The teacher</span>
<span>gives them tissues.</span>

</p> </div>
