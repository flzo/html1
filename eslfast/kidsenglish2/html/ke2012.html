<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span> He has a school supplies box.</span>
<span>There are five pencils inside.</span>
<span>They are sharp.</span>
<span>They are all yellow.</span>
<span>They all have a pink eraser</span>
<span>at the end.</span>
<span>He has two erasers.</span>
<span>One eraser is white.</span>
<span>Another is pink.</span>
<span>He uses the pencil</span>
<span>to write something.</span>
<span>He uses the eraser</span>
<span>to fix his mistake.</span>
