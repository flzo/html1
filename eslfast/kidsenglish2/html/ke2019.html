<title>19. Frying Tofu</title>
</head>
<body>

<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He slices up tofu</span>
<span>in ten pieces.</span>
<span>He puts the pan</span>
<span>on the stove.</span>
<span>He turns on the stove.</span>
<span>He puts oil</span>
<span>in the pan.</span>
<span>He puts the tofu</span>
<span>in the pan.</span>
<span>He waits for the tofu</span>
<span>to turn brown.</span>
<span>He flips over the tofu.</span>
<span>Now the other side</span>
<span>is frying.</span>
<span>He waits for the tofu</span>
<span>to turn brown again.</span>
<span>He turns off the stove.</span>

</p> </div>
