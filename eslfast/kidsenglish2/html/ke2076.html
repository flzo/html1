<title>76. He Cleans the Table</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish2/ke2/ke2076.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish2/audio/ke2076t.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He works at a cafe.</span>
<span>He cleans the tables.</span>
<span>He takes away</span>
<span>the dirty plates.</span>
<span>He takes away</span>
<span>the sauce bottles.</span>
<span>He uses a rag</span>
<span>to wipe the table.</span>
<span>He does the same thing</span>
<span>for all the tables.</span>
<span>He sweeps the floor.</span>
<span>He cleans the chairs.</span>
<span>He puts the chairs</span>
<span>on top of the tables</span>
<span>at the end.</span>

</p> </div>
