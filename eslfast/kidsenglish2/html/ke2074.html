<span>She is in the car.</span>
<span>She waits</span>
<span>for the car in front</span>
<span>to move.</span>
<span>The traffic is bad.</span>
<span>A man on the street</span>
<span>knocks on her window.</span>
<span>She opens the window.</span>
<span>He asks for money.</span>
<span>She has no money.</span>
<span>She gives him</span>
<span>a sandwich.</span>
<span>He is so happy.</span>
<span>He asks another driver</span>
<span>for money.</span>
