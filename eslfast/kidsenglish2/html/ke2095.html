<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She chews gum in class.</span>
<span>The teacher gets mad.</span>
<span>Mr. Hill tells her</span>
<span>that she has detention</span>
<span>during recess.</span>
<span>She asks him</span>
<span>what she has to do.</span>
<span>He says</span>
<span>she has to take the gum</span>
<span>off the desk.</span>
<span>He tells her</span>
<span>to look under the desk.</span>
<span>There is so much gum.</span>
<span>She is grossed out.</span>

</p> </div>
