<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Howard goes</span>
<span>to a backpack store.</span>
<span>He likes the red backpack.</span>
<span>He looks at the tag.</span>
<span>The backpack is $40!</span>
<span>He asks the cashier</span>
<span>if he can lower the price.</span>
<span>"I will sell it you for $39."</span>
<span>Howard shakes his head.</span>
<span>"How about $30,</span>
<span>and I tell my friends</span>
<span>to come here?"</span>
<span>The cashier</span>
<span>agrees to the deal.</span>

</p> </div>
