<title>66. He Washes Dishes</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish2/ke2/ke2066.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish2/audio/ke2066i.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He puts on </span>
<span>his dishwashing gloves.</span>
<span>He gets the sponge.</span>
<span>He squeezes</span>
<span>a little bit of dish soap</span>
<span>on it.</span>
<span>He picks up a plate</span>
<span>with his left hand.</span>
<span>He puts the sponge on it.</span>
<span>He moves his hand</span>
<span>in circles.</span>
<span>He turns on the faucet.</span>
<span>The water</span>
<span>washes the soap away.</span>
<span>The dish is clean.</span>

</p> </div>
