<span>It is Black Friday.</span>
<span>Black Friday</span>
<span>is always the day</span>
<span>after Thanksgiving.</span>
<span>A lot of stores</span>
<span>have good deals.</span>
<span>The stores are busy.</span>
<span>The lines are long.</span>
<span>People want to buy things.</span>
<span>They buy clothes.</span>
<span>They buy electronics.</span>
<span>They buy cooking items.</span>
<span>Sometimes</span>
<span>people fight for items.</span>
<span>It can get crazy.</span>
