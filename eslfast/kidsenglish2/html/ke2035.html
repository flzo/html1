<span>It is nice and sunny</span>
<span>at the beach.</span>
<span>The sun is shining.</span>
<span>There is a nice breeze.</span>
<span>People are swimming</span>
<span>in the water.</span>
<span>People are tanning</span>
<span>under the sun.</span>

<span>No one else</span>
<span>is making a sandcastle.</span>
<span>He can use</span>
