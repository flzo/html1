<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span> She goes to the mall.</span>
<span>She goes inside a store.</span>
<span>She sees a nice skirt.</span>
<span>She takes it </span>
<span>off the rack.</span>
<span>She touches it.</span>
<span>She goes to the fitting-room.</span>
<span>She tries it on.</span>
<span>It fits perfectly.</span>
<span>She goes to the cash register.</span>
<span>She hands the cashier $10.</span>
<span>The cashier puts the skirt</span>
<span>in a bag.</span>

</p> </div>
