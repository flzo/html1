<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>Tim gets down</span>
<span>on one knee.</span>
<span>He looks</span>
<span>into Shirley's eyes.</span>
<span>He asks,</span>
<span>"Will you marry me?"</span>
<span>Shirley cries.</span>
<span>Shirley nods her head.</span>
<span>Tim and Shirley hug.</span>
<span>People around them clap.</span>
<span>Tim and Shirley</span>
<span>call all their friends</span>
<span>and family.</span>
<span>Tim's mom</span>
<span>does not like Shirley.</span>
<span>Tim does not care.</span>
