<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She hears a "meow."</span>
<span>It is coming</span>
<span>from the tree.</span>
<span>She looks closely</span>
<span>at the tree.</span>
<span>She sees a cute,</span>
<span>white cat.</span>
<span>It is stuck.</span>
<span>She climbs up the tree.</span>
<span>She brings the cat down.</span>
<span>The cat's owner is happy.</span>
<span>The cat's owner</span>
<span>gives her $15.</span>
<span>She buys her own cat</span>
<span>with the money.</span>
