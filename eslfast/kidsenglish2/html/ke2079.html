<title>79. He Does Not Eat Meat</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish2/ke2/ke2079.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish2/audio/ke2079c.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He is a vegetarian.</span>
<span>He does not eat meat.</span>
<span>He believes</span>
<span>that animals</span>
<span>should not be killed.</span>
<span>It is hard for him</span>
<span>to go out with people.</span>
<span>Most people</span>
<span>like eating meat.</span>
<span>He tells his parents</span>
<span>to become vegetarians.</span>
<span>They laugh at him.</span>
<span>They can't give up meat.</span>

</p> </div>
