<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He eats his breakfast.</span>
<span>He leaves his house.</span>
<span>He walks</span>
<span>to the bus stop.</span>
<span>He waits</span>
<span>five minutes.</span>
<span>He gets on the bus.</span>
<span>He puts in a quarter.</span>
<span>He sits down.</span>
<span>He looks</span>
<span>outside the window.</span>
<span>He sees his school.</span>
<span>He walks</span>
<span>to the bus door.</span>
<span>He thanks the bus driver.</span>
<span>He exits the bus.</span>

</p> </div>
