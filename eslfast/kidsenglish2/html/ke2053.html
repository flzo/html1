<title>53. She Washes Her Face</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish2/ke2/ke2053.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish2/audio/ke2053p.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She fills up a bowl</span>
<span>with water.</span>
<span>She pumps some liquid face wash</span>
<span>onto her hand.</span>
<span>She closes her eyes.</span>
<span>She rubs the face wash</span>
<span>all over her face.</span>
<span>She puts her hands</span>
<span>in the bowl of water.</span>
<span>She splashes the water</span>
<span>on her face.</span>
<span>She does this</span>
<span>until the water is all gone.</span>
<span>She dries her face</span>
<span>with a towel.</span>

</p> </div> 
</body>
