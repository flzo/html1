<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He buys a present</span>
<span>for his girlfriend.</span>
<span>It is her favorite book.</span>
<span>He gets wrapping paper.</span>
<span>He puts the book</span>
<span>on top of the paper.</span>
<span>He folds the paper.</span>
<span>He tapes the paper down.</span>
<span>He writes her name on it.</span>
<span>He puts a bow</span>
<span>on the wrapped book.</span>
<span>He puts the present</span>
<span>in a gift bag.</span>

</p> </div>
