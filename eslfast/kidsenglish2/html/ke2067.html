<title>67. She Uses a Spare Key</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish2/ke2/ke2067.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish2/audio/ke2067g.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She walks up</span>
<span>to the door.</span>
<span>She looks inside her bag.</span>
<span>She tries</span>
<span>to find her key.</span>
<span>She cannot find it.</span>
<span>She thinks</span>
<span>she left it</span>
<span>inside the house.</span>
<span>It is okay though.</span>
<span> She has a spare key.</span>
<span>She lifts up the welcome mat.</span>
<span>She picks up the key.</span>
<span>She uses it.</span>
<span>It works!</span>
<span>She goes</span>
<span>inside her house.</span>

</p> </div>
