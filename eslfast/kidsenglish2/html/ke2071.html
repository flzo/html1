<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She has to make a speech </span>
<span>about birds.</span>
<span>She is nervous.</span>
<span>She does not like talking</span>
<span>in front of people.</span>
<span>She does not want to mess up.</span>
<span>She does not want people</span>
<span>to make fun of her.</span>
<span>She tells her teacher</span>
<span>she is scared.</span>
<span>The teacher tells her</span>
<span>to relax.</span>
<span>All the students</span>
<span>are scared.</span>
