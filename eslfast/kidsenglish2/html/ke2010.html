<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He sits down</span>
<span>in his seat.</span>
<span>He gets a copy of the test.</span>
<span>He reads a question.</span>
<span>He writes his answer.</span>
<span>There are 20 questions.</span>
<span>He checks his answers again</span>
<span>when he is done.</span>
<span>The bell rings.</span>
<span>The class is over.</span>
<span>He gets up.</span>
<span>He hands his test</span>
<span>to the teacher.</span>
<span>He is going to celebrate.</span>

</p> </div>
