<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He is playing a game</span>
<span>on his computer.</span>
<span>He gets a glass of water</span>
<span>from the kitchen.</span>
<span>He puts it on his desk.</span>
<span>He accidentally</span>
<span>knocks down the glass.</span>
<span>The water spills</span>
<span>all over his keyboard.</span>
<span>His computer screen</span>
<span>turns black.</span>
<span>He tries</span>
<span>to turn his computer back on.</span>
<span>It did not work.</span>

</p> </div>
