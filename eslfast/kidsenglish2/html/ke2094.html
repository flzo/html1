<title>94. She Waits for the Mail Carrier</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish2/ke2/ke2094.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish2/audio/ke2094g.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She stands</span>
<span>outside the house.</span>
<span>She looks to the left.</span>
<span>She looks to the right.</span>
<span>She waits for the mail carrier.</span>
<span>A package from her mom</span>
<span>is arriving.</span>
<span>She sees the mail carrier.</span>
<span>He is wearing a blue shirt.</span>
<span>He waves hello.</span>
<span>He gives her the package.</span>
<span>She signs it.</span>
<span>She runs into her house.</span>

</p> </div>
