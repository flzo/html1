</head>

<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>It is summer.</span>
<span>The sun is out</span>
<span>and shining.</span>
<span>She goes to the beach.</span>
<span>She lays a towel</span>
<span>on the sand.</span>
<span>She puts on sunscreen.</span>
<span>It protects her skin.</span>
<span>She puts on sunglasses.</span>
<span>She does not want the sun</span>
<span>to hurt her eyes.</span>
<span>She lies down</span>
<span>on the towel.</span>
<span>She is excited</span>
<span>to get tan.</span>

</p> </div>
