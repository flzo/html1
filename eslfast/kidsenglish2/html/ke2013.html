</head>

<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He takes out a pen.</span>
<span>He takes off the cap.</span>
<span>He drops it.</span>
<span>He looks down.</span>
<span>He does not see the cap.</span>
<span>He looks around his desk.</span>
<span>He still does not see the cap.</span>
<span>Where could it be?</span>
<span>He has to find it.</span>
<span>The pen will dry out</span>
<span>without the cap.</span>
<span>He goes</span>
<span>to the other side of the room.</span>
<span>He sees the cap.</span>

</p> </div>
