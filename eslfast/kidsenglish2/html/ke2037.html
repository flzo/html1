<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She puts her running shoes on.</span>
<span>She leaves her apartment.</span>
<span>She runs to her school.</span>
<span>She likes</span>
<span>to look at other houses.</span>
<span>She likes</span>
<span>the feeling of the wind</span>
<span>on her face.</span>
<span>She gets to the school.</span>
<span>She sees her teacher.</span>
<span>She does not like that teacher.</span>
<span>She runs back home.</span>

</p> </div>
