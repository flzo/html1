<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He finds a dog</span>
<span>on the street.</span>
<span>There is no collar.</span>
<span>He likes dogs.</span>
<span>He takes it</span>
<span>into his house.</span>
<span>He washes it.</span>
<span>He takes it</span>
<span>to the veterinarian.</span>
<span>The dog is sick.</span>
<span>It will die soon.</span>
<span>The surgery</span>
<span>will not help that much.</span>
<span>He decides to let the dog go.</span>
