<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He sits down</span>
<span>on the floor.</span>
<span>People stare at him.</span>
<span>He puts his fingers</span>
<span>on the guitar strings.</span>
<span>He plays a song.</span>
<span>The song is about love.</span>
<span>People tap their feet.</span>
<span>They ask him</span>
<span>to play another song.</span>
<span>He is happy.</span>
<span>He plays another song.</span>
<span>His girlfriend arrives.</span>
<span>He sings louder.</span>

</p> </div>
