<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She takes out</span>
<span>her coloring book.</span>
<span>She gets her crayons.</span>
<span>She opens the book.</span>
<span>There is a drawing</span>
<span>of a bunny dancing.</span>
<span>She colors the bunny</span>
<span>with a brown crayon.</span>
<span>She colors the sky</span>
<span>with a blue crayon.</span>
<span>She colors the flower</span>
<span>with a red crayon.</span>
<span>She rips the page out.</span>
<span>She sticks it</span>
<span>to the wall.</span>

</p> </div>
