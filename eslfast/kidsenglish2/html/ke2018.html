<title>18. Chicken Smells Good</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish2/ke2/ke2018.htm -->

<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He is hungry.</span>
<span>He smells something good.</span>
<span>It is coming from the kitchen.</span>
<span>He leaves the living-room.</span>
<span>He goes to the kitchen.</span>
<span>He sees a plate of chicken.</span>
<span>It is hot.</span>
<span>He gets a fork and knife.</span>
<span>He cuts a piece of chicken.</span>
<span>He sticks the fork in it.</span>
<span>He eats the chicken.</span>

</p> </div>
