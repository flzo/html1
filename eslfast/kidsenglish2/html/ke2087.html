<span>He gets ready</span>
<span>for basketball practice.</span>
<span>He is the team captain.</span>
<span>He wears</span>
<span>a t-shirt and loose shorts.</span>
<span>He wears</span>
<span>basketball shoes.</span>
<span>He fills up</span>
<span>his water bottle.</span>
<span>He puts it</span>
<span>inside his gym bag.</span>
<span>He also</span>
<span>puts his basketball inside.</span>
<span>He gets in his car.</span>
<span>He drives</span>
<span>to the gym.</span>
