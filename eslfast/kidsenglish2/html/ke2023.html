<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He is bald.</span>
<span>He wants to get a hat</span>
<span>to cover his baldness.</span>
<span>He goes to a hat store.</span>
<span>There are</span>
<span>a lot of different hats.</span>
<span>There are caps.</span>
<span>They are good</span>
<span>to wear in the summer.</span>
<span>There are beanies.</span>
<span>They are good</span>
<span>to wear for the winter.</span>
<span>He buys</span>
<span>a beanie and a cap.</span>

</p> </div>
