<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He picks out roses</span>
<span>from his garden.</span>
<span>He puts the roses</span>
<span>in a vase.</span>
<span>He pours water</span>
<span>in the vase.</span>
<span>He goes</span>
<span>to his girlfriend's house.</span>
<span>He rings her doorbell.</span>
<span>She is happy</span>
<span>to see him.</span>
<span>She hugs him.</span>
<span>She likes the roses.</span>
<span>He tells her</span>
<span>to water them every day.</span>
