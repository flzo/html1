<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She brings her dress</span>
<span>back to the store.</span>
<span>It is too big.</span>
<span>She needs a smaller size.</span>
<span>The store</span>
<span>does not have a smaller size.</span>
<span>She returns it.</span>
<span>She gets her money back.</span>
<span>She sees another dress she likes.</span>
<span>It is very pretty.</span>
<span>She buys it.</span>
<span>It is cheaper</span>
<span>than the other dress.</span>

</p> </div>
