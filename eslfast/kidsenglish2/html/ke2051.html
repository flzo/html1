<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>She is a doctor.</span>
<span>She treats children.</span>
<span>She takes care of them.</span>
<span>She asks them</span>
<span>what is wrong.</span>
<span>She tells them</span>
<span>everything is going to be okay.</span>
<span>She gives them candy</span>
<span>at the end.</span>
<span>The children love her.</span>
<span>She gives the prescription</span>
<span>to the parents.</span>

</p> </div>
