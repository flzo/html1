<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>It is summer.</span>
<span>It is 3 o'clock.</span>
<span>It is very hot.</span>
<span>He goes</span>
<span>to the ice cream shop.</span>
<span>He looks at all the flavors.</span>
<span>There are so many!</span>
<span>He wants to get chocolate,</span>
<span>but he also wants vanilla.</span>
<span>He decides to get both.</span>
<span>The line is long.</span>
<span>Everyone wants ice cream</span>
<span>in the summer.</span>

</p> </div>
