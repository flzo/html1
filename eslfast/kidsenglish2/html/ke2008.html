<title>8. Taking Notes</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish2/ke2/ke2008.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish2/audio/ke2008d.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He takes out</span>
<span>his notebook.</span>
<span>He reads his textbook.</span>
<span>He copies the chapter title</span>
<span>on top of the page.</span>
<span>He writes down</span>
<span>important information.</span>
<span>He highlights words</span>
<span>he should remember.</span>
<span>He turns the page.</span>
<span>He takes more notes.</span>
<span>He writes a summary</span>
<span>of the chapter</span>
<span>at the end.</span>

</p> </div>
