<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He loves a girl.</span>
<span>He loves</span>
<span>how she talks.</span>
<span>He loves</span>
<span>how she walks.</span>
<span>He thinks</span>
<span>she is pretty.</span>
<span>He thinks</span>
<span>she is smart.</span>
<span>She is perfect.</span>
<span>She does not know</span>
<span>he loves her.</span>
<span>He asks her out.</span>
<span>She says no.</span>
<span>He is sad.</span>
<span>He still loves her.</span>
<span>He will</span>
<span>ask her out again.</span>

</p> </div>
