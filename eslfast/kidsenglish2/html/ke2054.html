<title>54. She Gives Him a Bible</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish2/ke2/ke2054.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish2/audio/ke2054r.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>He is walking.</span>
<span>A woman stops him.</span>
<span>She asks</span>
<span>if he is Christian.</span>
<span>He says no.</span>
<span>She says</span>
<span>that he should be.</span>
<span>She gives him a Bible.</span>
<span>He takes it.</span>
<span>He reads it.</span>
<span>He thinks</span>
<span>it is really interesting.</span>
<span>He cannot put it down.</span>
<span>He goes</span>
<span>to a nearby church.</span>
<span>He prays.</span>

</p> </div>
