<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>It is Halloween.</span>
<span>Halloween is the time</span>
<span>when people dress up.</span>
<span>Young people</span>
<span>like to dress up.</span>
<span>Old people</span>
<span>just wear regular clothes.</span>
<span>Children like</span>
<span>to go trick-or-treating.</span>
<span>They go to a house.</span>
<span>They ring the doorbell.</span>
<span>They say "trick or treat!"</span>
<span>They get candy.</span>
<span>They go to another house.</span>
