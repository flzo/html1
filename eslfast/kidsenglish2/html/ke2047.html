<span>She is a babysitter.</span>
<span>She charges parents</span>
<span>$10 per hour.</span>
<span>Babysitting</span>
<span>is a part-time job for her.</span>
<span>She goes to the house.</span>
<span>She plays with the kids.</span>
<span>She helps them</span>
<span>with their homework.</span>
<span>She cooks for them.</span>
<span>The parents</span>
<span>come back from work.</span>
<span>They thank her.</span>
<span>They pay her $80.</span>
