<title>83. Scrubbing the Floor</title>
</head>
<body>
<!-- source: https://www.eslfast.com/kidsenglish2/ke2/ke2083.htm -->
<!-- audio: https://www.eslfast.com/kidsenglish2/audio/ke2083r.mp3 -->
<div style="font-family: arial; font-size: 2rem;"><p class="timed vocab all-p" style="text-indent: .35in;">

<span>It is time to clean.</span>
<span>She gets a bucket.</span>
<span>She fills it</span>
<span>with water and soap.</span>
<span>It is all bubbly now.</span>
<span>She puts a sponge</span>
<span>inside the bucket.</span>
<span>It is wet.</span>
<span>She scrubs the floor.</span>
<span>It takes an hour.</span>
<span>Her house is big.</span>
<span>Later,</span>
<span>she dries the floor</span>
<span>with towels.</span>

</p> </div>
