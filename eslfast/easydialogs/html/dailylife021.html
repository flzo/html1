<b>A:</b> It's Sunday.<br><br>
<b>B:</b> So?<br><br>
<b>A:</b> You know what that means.<br><br>
<b>B:</b> I forgot.<br><br>
<b>A:</b> Sunday means we go to church.<br><br>
<b>B:</b> Oh, yeah.<br><br>
<b>A:</b> Put on a coat and tie.<br><br>
<b>B:</b> Why?<br><br>
<b>A:</b> To show respect to God and others.<br><br>
<b>B:</b> I'm glad Sunday is only once a week.<br><br>
<b>A:</b> I hope God didn't hear that.<br><br>
<b>B:</b> He'll forgive me.
