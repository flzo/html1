<p class="timed">

<b>A:</b> I'm sleepy.<br><br>
<b>B:</b> So am I.<br><br>
<b>A:</b> I had a long day.<br><br>
<b>B:</b> So did I.<br><br>
<b>A:</b> I didn't even have lunch.<br><br>
<b>B:</b> Neither did I.<br><br>
<b>A:</b> I was busy the whole day.<br><br>
<b>B:</b> So was I.<br><br>
<b>A:</b> I had to bring work home with me.<br><br>
<b>B:</b> I did too.<br><br>
<b>A:</b> Your day was just like mine.<br><br>
<b>B:</b> Of course it was. We work together!

</p>
