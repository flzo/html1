<b>A:</b> Ms. Thomas. I'm not feeling well.<br><br>
<b>B:</b> What is it, Elizabeth?<br><br>
<b>A:</b> My head hurts.<br><br>
<b>B:</b> You may have a headache.<br><br>
<b>A:</b> Yes, I think I do.<br><br>
<b>B:</b> Let's go see the school nurse.<br><br>
<b>A:</b> Okay, Ms. Thomas.<br><br>
<b>B:</b> I'll be back in class. Try to be quiet.<br><br>
