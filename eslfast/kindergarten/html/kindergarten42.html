<b>A:</b> Can you help me, Barbara?<br><br>
<b>B:</b> Sure, dad. With what?<br><br>
<b>A:</b> It's time to decorate our Christmas tree.<br><br>
<b>B:</b> That sounds like fun!<br><br>
<b>A:</b> Here is the tinsel, and the lights.<br><br>
<b>B:</b> Can I string the lights, dad?<br><br>
<b>A:</b> Sure, Barbara. Go all the way around.<br><br>
<b>B:</b> I like decorating the tree.<br><br>
