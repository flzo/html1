<b>A:</b> Let's go to see a movie, Anthony.<br><br>
<b>B:</b> That sounds great, Lisa.<br><br>
<b>A:</b> What do you want to see?<br><br>
<b>B:</b> Let's see something funny.<br><br>
<b>A:</b> Do you know of a good one?<br><br>
<b>B:</b> Yes, but let's pick one we both like.<br><br>
