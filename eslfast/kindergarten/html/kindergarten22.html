<b>A:</b> Hello Mary. How was school today?<br><br>
<b>B:</b> It was great, mom. Thanks.<br><br>
<b>A:</b> Do you have any homework?<br><br>
<b>B:</b> Yes. I do, in math and English.<br><br>
<b>A:</b> Have something to eat first.<br><br>
<b>B:</b> Okay, mom.<br><br>
<b>A:</b> You can do homework after dinner.<br><br>
<b>B:</b> Sounds good, mom. Thank you.<br><br>
