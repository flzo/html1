<p class="timed">

<b>A:</b> Can you give me a hand, Nancy?<br><br>
<b>B:</b> Sure, dad. What can I do?<br><br>
<b>A:</b> I need to change a tire.<br><br>
<b>B:</b> Okay. I'd love to help.<br><br>
<b>A:</b> Hand me that tool, dear.<br><br>
<b>B:</b> Here it is, dad.<br><br>
<b>A:</b> You are a good helper.<br><br>
<b>B:</b> Thanks, dad.<br><br>
