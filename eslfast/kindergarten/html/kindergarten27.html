<b>A:</b> Maria! It's time for dinner.<br><br>
<b>B:</b> Okay, mommy. I'm on my way.<br><br>
<b>A:</b> Sit on that chair, dear.<br><br>
<b>B:</b> This one?<br><br>
<b>A:</b> Yes, Maria. The big chair.<br><br>
<b>B:</b> I never sat here before.<br><br>
<b>A:</b> I made chicken tonight.<br><br>
<b>B:</b> Yum! I love your chicken, mom.<br><br>
