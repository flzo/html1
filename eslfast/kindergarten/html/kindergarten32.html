<b>A:</b> Look at that guy, Donald.<br><br>
<b>B:</b> What guy, Dorothy?<br><br>
<b>A:</b> The one with his head down.<br><br>
<b>B:</b> He is looking at his cell phone.<br><br>
<b>A:</b> I know, but he didn't see that car.<br><br>
<b>B:</b> What car?<br><br>
<b>A:</b> A car almost hit him.<br><br>
<b>B:</b> Wow. We should always pay attention.<br><br>
