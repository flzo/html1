<b>A:</b> Maria, dear. Can you come here?<br><br>
<b>B:</b> What is it, mommy?<br><br>
<b>A:</b> I want you to pick some lemons.<br><br>
<b>B:</b> From the backyard tree?<br><br>
<b>A:</b> Yes, dear. I'm making lemonade.<br><br>
<b>B:</b> Yummy. I can reach four, I think.<br><br>
<b>A:</b> That should be enough, dear.<br><br>
<b>B:</b> Okay, mommy.<br><br>
