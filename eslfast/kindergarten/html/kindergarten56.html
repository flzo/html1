<p class="timed">

<b>A:</b> This is fun, dad.<br><br>
<b>B:</b> Yes, it is. Let's fish.<br><br>
<b>A:</b> What should I do?<br><br>
<b>B:</b> Hold your pole over the water.<br><br>
<b>A:</b> Like this?<br><br>
<b>B:</b> Yes. Look! You caught a fish.<br><br>
<b>A:</b> Oh, daddy! What do I do?<br><br>
<b>B:</b> Hold on, son. I'll get a net.<br><br>
