<b>A:</b> Hi Betty. Want to go for a ride?<br><br>
<b>B:</b> Where to, Sarah?<br><br>
<b>A:</b> Nowhere special. Just a ride.<br><br>
<b>B:</b> That sounds like fun.<br><br>
<b>A:</b> Yes. It is.<br><br>
<b>B:</b> Do you have enough gas?<br><br>
<b>A:</b> Yes, I do.<br><br>
<b>B:</b> Here is some money for gas anyway.<br><br>
