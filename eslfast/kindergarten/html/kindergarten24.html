<b>A:</b> Is this your first baseball game, Anthony?<br><br>
<b>B:</b> Yes, it is. Donna. How about you?<br><br>
<b>A:</b> No. I have come to a lot of games.<br><br>
<b>B:</b> You are so lucky.<br><br>
<b>A:</b> My big brother is working at the stadium.<br><br>
<b>B:</b> He is working there?<br><br>
<b>A:</b> Yes, and he got me into a lot of games.<br><br>
<b>B:</b> Wow. That must be nice.<br><br>
