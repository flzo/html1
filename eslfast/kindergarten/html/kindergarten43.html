<p class="timed">

<b>A:</b> Gee, dad. Is my mom okay?<br><br>
<b>B:</b> Of course she is, Sharon.<br><br>
<b>A:</b> But we are at the hospital.<br><br>
<b>B:</b> It's because she is having a baby tonight.<br><br>
<b>A:</b> Tonight? Are you sure?<br><br>
<b>B:</b> Yes, Sharon. You are getting a baby sister.<br><br>
<b>A:</b> A baby sister? Wow! I can't wait.<br><br>
<b>B:</b> Your mom will be fine. Don't worry.<br><br>

</p>
