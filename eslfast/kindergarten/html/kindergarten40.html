<p class="timed">

<b>A:</b> I am taking you to the dentist today.<br><br>
<b>B:</b> Oh, no. Do I have to go, mom?<br><br>
<b>A:</b> Don't worry, Joey.<br><br>
<b>B:</b> Going to the dentist hurts, mom.<br><br>
<b>A:</b> This is just a checkup.<br><br>
<b>B:</b> What is a checkup?<br><br>
<b>A:</b> It's to see if your teeth are okay.<br><br>
<b>B:</b> That's not so bad.<br><br>
