<b>A:</b> Today we are going to the library.<br><br>
<b>B:</b> What is library, Ms. Thomas?<br><br>
<b>A:</b> It is a place to study, Betty.<br><br>
<b>B:</b> What do they have there?<br><br>
<b>A:</b> Books, computers, classes, and more.<br><br>
<b>B:</b> That sounds like fun.<br><br>
<b>A:</b> It is, Betty. And you can learn there.<br><br>
<b>B:</b> I can't wait to go. Let's go!<br><br>
