<p class="timed">

<b>A:</b> I love going to the movies.<br><br>
<b>B:</b> Me too, Helen.<br><br>
<b>A:</b> We have to pay first, Daniel.<br><br>
<b>B:</b> I know. There's the line to pay.<br><br>
<b>A:</b> Hurry, before the line gets too long.<br><br>
<b>B:</b> I am hurrying!<br><br>
<b>A:</b> Do you want to get some popcorn?<br><br>
<b>B:</b> Sure. What's a movie without popcorn?<br><br>
