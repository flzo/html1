<p class="timed">

<b>A:</b> Hi Lisa. How are you? <br><br>
<b>B:</b> I'm fine. What are you doing?<br><br>
<b>A:</b> I'm reading a book.<br><br>
<b>B:</b> Really? All of it?<br><br>
<b>A:</b> No. Just this part.<br><br>
<b>B:</b> Who's that?<br><br>
<b>A:</b> It's Mary. She has a dog.<br><br>
<b>B:</b> Let's read it together.<br><br>
