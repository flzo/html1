<b>A:</b> Are we going fishing, dad?<br><br>
<b>B:</b> Yes, Christopher. Today is the day.<br><br>
<b>A:</b> Where are we going?<br><br>
<b>B:</b> To the lake, son.<br><br>
<b>A:</b> What do I bring?<br><br>
<b>B:</b> Just get your pole. I got the rest.<br><br>
<b>A:</b> I'm so happy.<br><br>
<b>B:</b> Me too, son.<br><br>
