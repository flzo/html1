<p class="timed">

<b>A:</b> Wow! It sure is hot today.<br><br>
<b>B:</b> Yes, it is. It's probably 90 degrees.<br><br>
<b>A:</b> Did you want to go somewhere?<br><br>
<b>B:</b> Sure! How about a movie?<br><br>
<b>A:</b> A movie would be great, Lisa.<br><br>
<b>B:</b> Yes. It will be cool there.<br><br>
<b>A:</b> Going to a movie is a great idea.<br><br>
<b>B:</b> Anything to cool us down, Alice.<br><br>
