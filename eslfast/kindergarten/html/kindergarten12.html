<b>A:</b> Hi. My name is Mary.<br><br>
<b>B:</b> Hello, Mary. I'm Michelle.<br><br>
<b>A:</b> It's nice to meet you, Michelle.<br><br>
<b>B:</b> Thank you. What do you want to do?<br><br>
<b>A:</b> I have to go to class now.<br><br>
<b>B:</b> Yeah. Me too. We'll meet later?<br><br>
<b>A:</b> Yes. We can meet after school.<br><br>
<b>B:</b> Okay. I'll see you then.<br><br>
