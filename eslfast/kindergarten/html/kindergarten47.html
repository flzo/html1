<b>A:</b> Jason. It's time to feed the dog.<br><br>
<b>B:</b> Already, mom? Okay.<br><br>
<b>A:</b> We have to feed him twice a day.<br><br>
<b><b>B:</b></b> What should I give him?<br><br>
<b>A:</b> One can and one scoop of dry food.<br><br>
<b>B:</b> Is that all?<br><br>
<b>A:</b> Yes. That's plenty.<br><br>
<b>B:</b> He really likes it, mom.<br><br>
