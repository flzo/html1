<p class="timed">

<b>A:</b> Hey Joseph. Want to play?<br><br>
<b>B:</b> Sure, Steven. What do you want to play?<br><br>
<b>A:</b> How about Hide and Seek?<br><br>
<b>B:</b> How do you play that?<br><br>
<b>A:</b> I'll close my eyes and count to 10.<br><br>
<b>B:</b> What do I do?<br><br>
<b>A:</b> You hide. Then I'll go look for you.<br><br>
<b>B:</b> That sounds like fun.<br><br>
