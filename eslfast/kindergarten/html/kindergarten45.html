<p class="timed">

<b>A:</b> What's the teacher doing, Richard?<br><br>
<b>B:</b> She is calling the roll, Jennifer.<br><br>
<b>A:</b> What does it mean?<br><br>
<b>B:</b> It is to check who is in class today.<br><br>
<b>A:</b> What should I do?<br><br>
<b>B:</b> When she calls your name, say "here."<br><br>
<b>A:</b> What is that for?<br><br>
<b>B:</b> So that she knows you are here today.<br><br>
