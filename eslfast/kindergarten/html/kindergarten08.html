<p class="timed">

<b>A:</b> Hey, Lisa. Let's go ride the merry-go-round.<br><br>
<b>B:</b> What is that?<br><br>
<b>A:</b> It's a game we can play. Follow me.<br><br>
<b>B:</b> Okay, Carol. Let's go.<br><br>
<b>A:</b> Here you get on. I'll push.<br><br>
<b>B:</b> Wow! This goes fast. Jump on!<br><br>
<b>A:</b> Okay. Here I go!<br><br>
<b>B:</b> Yay! This is fun!<br><br>
