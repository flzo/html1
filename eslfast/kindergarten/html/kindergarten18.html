<b>A:</b> Good morning, Jennifer.<br><br>
<b>B:</b> Hi, Nancy. You are here early.<br><br>
<b>A:</b> My mom drove me to school today.<br><br>
<b>B:</b> You don't take the school bus?<br><br>
<b>A:</b> Not always. <br><br>
<b>B:</b> I take the bus every day.<br><br>
<b>A:</b> I used to. Now my mom drives me.<br><br>
<b>B:</b> I like taking the bus.<br><br>
