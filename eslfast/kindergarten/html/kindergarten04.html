<b>A:</b> Teacher, I have a question.<br><br>
<b>B:</b> Please raise your hand, Karen.<br><br>
<b>A:</b> Raise my hand?<br><br>
<b>B:</b> Yes. Raise your hand first.<br><br>
<b>A:</b> Okay, teacher. My hand is up.<br><br>
<b>B:</b> Yes, Karen. What is your question?<br><br>
<b>A:</b> What time is class over?<br><br>
<b>B:</b> It is over at 2:00 o'clock.<br><br>
