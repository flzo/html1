<b>A:</b> What's that bell for?<br><br>
<b>B:</b> It means it's recess time, Charles.<br><br>
<b>A:</b> What's that?<br><br>
<b>B:</b> It's a break from class.<br><br>
<b>A:</b> A break? For what, Kevin?<br><br>
<b>B:</b> So we can play outside.<br><br>
<b>A:</b> Really? Wow! Let's go.<br><br>
<b>B:</b> Yes. It's fun. We get one break per hour.<br><br>
