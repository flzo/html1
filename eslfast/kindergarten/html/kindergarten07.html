<b>A:</b> Hey, Mark. What are you doing?<br><br>
<b>B:</b> I am going to use the slide, Sarah.<br><br>
<b>A:</b> Can I come with you?<br><br>
<b>B:</b> Sure, you can. It's fun.<br><br>
<b>A:</b> Okay. Where do I go?<br><br>
<b>B:</b> Follow me up the ladder, Sarah.<br><br>
