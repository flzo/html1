<p class="timed">

<b>A:</b> Teacher! May I go to the bathroom?<br><br>
<b>B:</b> Class is over in 5 minutes, Donna.<br><br>
<b>A:</b> Can I go then?<br><br>
<b>B:</b> Yes, you can, Donna.<br><br>
<b>A:</b> I don't know if I can hold it.<br><br>
<b>B:</b> If you can't, then go, dear.<br><br>
<b>A:</b> I think I can go in a few minutes.<br><br>
<b>B:</b> Thank you, Donna.<br><br>
