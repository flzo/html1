<b>A:</b> Good morning Jason. Time to get up.<br><br>
<b>B:</b> Good morning, mom. Is it Christmas?<br><br>
<b>A:</b> Yes, dear. It's Christmas morning.<br><br>
<b>B:</b> Yay! Can I open my presents?<br><br>
<b>A:</b> Of course, you can. <br><br>
<b>B:</b> I can't wait to see what I got.<br><br>
<b>A:</b> Go ahead. This box is from your sister.<br><br>
<b>B:</b> I hope it's a racecar!<br><br>
