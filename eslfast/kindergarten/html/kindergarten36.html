<b>A:</b> This is my first boat ride, Patricia.<br><br>
<b>B:</b> It's mine too, Sandra.<br><br>
<b>A:</b> Is it safe?<br><br>
<b>B:</b> I thinks so. Daddy goes all the time.<br><br>
<b>A:</b> He told me we can row the boat.<br><br>
<b>B:</b> Row the boat?<br><br>
<b>A:</b> Yes. Take this oar and row.<br><br>
<b>B:</b> Wow. This is fun. We are moving.<br><br>
