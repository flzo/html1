<b>A:</b> Today we are flying, Richard.<br><br>
<b>B:</b> Are you sure it's safe, dad?<br><br>
<b>A:</b> Of course, son. I fly all the time.<br><br>
<b>B:</b> Can't we drive to grandma's house?<br><br>
<b>A:</b> Yes, we can, but it takes longer.<br><br>
<b>B:</b> Okay, dad. We'll fly.<br><br>
<b>A:</b> You are going to love it, son.<br><br>
<b>B:</b> I hope so.<br><br>
