<p class="timed">

<b>A:</b> My mom is baking a cake.<br><br>
<b>B:</b> I love to eat cake.<br><br>
<b>A:</b> It's chocolate.<br><br>
<b>B:</b> Yummy. Is it ready yet?<br><br>
<b>A:</b> Almost. I get to put on the frosting.<br><br>
<b>B:</b> Lucky you. Can I help?<br><br>
<b>A:</b> Sure you can. <br><br>
<b>B:</b> I love the frosting.<br><br>
