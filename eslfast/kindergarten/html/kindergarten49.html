<p class="timed">

<b>A:</b> Mommy. Can I have a cat?<br><br>
<b>B:</b> A cat? Why do you want one, Margaret?<br><br>
<b>A:</b> My friend Betty has one.<br><br>
<b>B:</b> She has a cat?<br><br>
<b>A:</b> Yes, and her cat is so cute.<br><br>
<b>B:</b> You have to take care of it.<br><br>
<b>A:</b> I know, mom. I'll feed it every day.<br><br>
<b>B:</b> Okay, Margaret. You'll have a cat.<br><br>

</p>
