<p class="timed">

<b>A:</b> Wake up, Jeff. It's time for school.<br><br>
<b>B:</b> Aw... mom. I'm still sleepy.<br><br>
<b>A:</b> I'm sorry, dear, but you'll miss your bus.<br><br>
<b>B:</b> Okay, mom. I'm up.<br><br>
<b>A:</b> Good job. Come and eat your cereal.<br><br>
<b>B:</b> Okay, mom.<br><br>
<b>A:</b> Here comes the school bus.<br><br>
<b>B:</b> I'm ready, mom. See you later.<br><br>
