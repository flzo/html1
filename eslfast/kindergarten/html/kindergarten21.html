<p class="timed">

<b>A:</b> Are we going to the park today, mom?<br><br>
<b>B:</b> Of course we will, David.<br><br>
<b>A:</b> When can we go?<br><br>
<b>B:</b> After our chores are done.<br><br>
<b>A:</b> Okay. What should I do?<br><br>
<b>B:</b> First, finish your homework.<br><br>
<b>A:</b> I am already finished, mom.<br><br>
<b>B:</b> Clean your room, and we can go.<br><br>
