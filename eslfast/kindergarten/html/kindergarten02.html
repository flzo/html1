<p class="timed">

<b>A:</b> Teacher, I have a question to ask.<br><br>
<b>B:</b> What is your question?<br><br>
<b>A:</b> Are we going to play this morning?<br><br>
<b>B:</b> Yes, we are, but not right now.<br><br>
<b>A:</b> When are we going to play?<br><br>
<b>B:</b> As soon as we finish our lesson.<br><br>
<b>A:</b> Can't we go a little early today?<br><br>
<b>B:</b> Maybe, if we finish our lesson early.<br><br>
