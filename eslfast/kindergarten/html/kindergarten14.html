<p class="timed">

<b>A:</b> Hi Maria. Want to color with me?<br><br>
<b>B:</b> Sure, Sandra. I love to color.<br><br>
<b>A:</b> This is blue. It's my favorite color.<br><br>
<b>B:</b> I like blue, too.<br><br>
<b>A:</b> What's your favorite color?<br><br>
<b>B:</b> I don't know, maybe pink.<br><br>
<b>A:</b> Here, try this pink. It's pretty.<br><br>
<b>B:</b> Yes, it is. It's perfect!<br><br>
