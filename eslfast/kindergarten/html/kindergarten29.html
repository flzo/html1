<p class="timed">

<b>A:</b> I am so excited about tomorrow, mommy.<br><br>
<b>B:</b> I know, dear, but it is bedtime.<br><br>
<b>A:</b> Okay. I hope I can sleep.<br><br>
<b>B:</b> Just close your eyes, and sleep will come.<br><br>
<b>A:</b> Can I get on the big rides tomorrow?<br><br>
<b>B:</b> I think so, if you are tall enough.<br><br>
<b>A:</b> I'm sure I am.<br><br>
<b>B:</b> Then you can get on them tomorrow.<br><br>

</p>
