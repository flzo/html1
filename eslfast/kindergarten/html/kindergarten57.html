<b>A:</b> We're sleeping here tonight, Jason.<br><br>
<b>B:</b> In the tent?<br><br>
<b>A:</b> Yes. It will be fun.<br><br>
<b>B:</b> I've never slept in a tent before.<br><br>
<b>A:</b> That's why I brought sleeping bags.<br><br>
<b>B:</b> Sleeping bags? What's that?<br><br>
<b>A:</b> Just slide into it, son.<br><br>
<b>B:</b> Hey! I like this. It's warm.<br><br>
