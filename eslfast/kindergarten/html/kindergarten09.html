<p class="timed">

<b>A:</b> What do you have for lunch, David?<br><br>
<b>B:</b> I have a peanut butter and jelly sandwich.<br><br>
<b>A:</b> That sounds good. I have tuna.<br><br>
<b>B:</b> Tuna is good too, Daniel.<br><br>
<b>A:</b> I like jelly. Do you want to trade?<br><br>
<b>B:</b> Sure. I like tuna.<br><br>
<b>A:</b> This trade is good for both of us.<br><br>
<b>B:</b> Yes, it is. Thanks, Daniel.<br><br>

</p>
