<p class="timed">

<b>A:</b> Hey, James. You want to play?<br><br>
<b>B:</b> Not right now,  Elizabeth.<br><br>
<b>A:</b> Come on. It'll be fun.<br><br>
<b>B:</b> What do you want to play?<br><br>
<b>A:</b> How about playing tag?<br><br>
<b>B:</b> That's boring. Let's play hide-and-seek.<br><br>
<b>A:</b> Okay. Who goes first?<br><br>
<b>B:</b> I'll hide first.<br><br>
