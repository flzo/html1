<p class="timed">

<b>A:</b> Robert! Can you come here?<br><br>
<b>B:</b> Okay, mom. I'm on my way.<br><br>
<b>A:</b> Would you take the trash out, dear?<br><br>
<b>B:</b> The can is empty, mom.<br><br>
<b>A:</b> No. Not this one. The outside can.<br><br>
<b>B:</b> The big can?<br><br>
<b>A:</b> Yes. Put it in the street. It's Tuesday.<br><br>
<b>B:</b> That's right. Pick-up is tomorrow.<br><br>
