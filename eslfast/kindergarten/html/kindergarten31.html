<b>A:</b> Okay Laura. Let's go.<br><br>
<b>B:</b> Just a second, mom.<br><br>
<b>A:</b> Don't forget to put on your seatbelts.<br><br>
<b>B:</b> Do I have to?<br><br>
<b>A:</b> Yes. You have to. <br><br>
<b>B:</b> But we are only going to the store.<br><br>
<b>A:</b> It's the law, Laura.<br><br>
<b>B:</b> And to be safe, too. Right, mom?<br><br>
