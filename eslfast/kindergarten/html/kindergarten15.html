<p class="timed">

<b>A:</b> Good morning, Jennifer.<br><br>
<b>B:</b> Hi Michelle. How are you?<br><br>
<b>A:</b> I'm happy. How about you?<br><br>
<b>B:</b> Me, too. Who is that?<br><br>
<b>A:</b> That's my baby brother Paul.<br><br>
<b>B:</b> He's cute. How old is he?<br><br>
<b>A:</b> He is only three years old.<br><br>
<b>B:</b> I wish I had a baby brother.<br><br>
