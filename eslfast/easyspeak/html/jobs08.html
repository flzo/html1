<b>B:</b> I'm a teacher.<br><br>
<b>A:</b> What grade do you teach?<br><br>
<b>B:</b> I teach 9th graders.<br><br>
<b>A:</b> Do you like your job?<br><br>
<b>B:</b> I hate it.<br><br>
<b>A:</b> What do you hate the most?<br><br>
<b>B:</b> I hate that they never listen to me.<br><br>
<b>A:</b> You can always punish them.<br><br>
<b>B:</b> I hit them.<br><br>
