<span>She wants</span>
<span>to buy a new laptop.</span>
<span>It costs $1,000.</span>
<span>She only has $500.</span>
<span>She saves up</span>
<span>to buy the laptop.</span>
<span>She does not eat</span>
<span>at restaurants.</span>
<span>She does not buy</span>
<span>any more clothes.</span>
<span>She only buys</span>
<span>things on sale.</span>
<span>She gets many jobs.</span>
