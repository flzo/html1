<span>You can do a lot of things</span>
<span>at the beach.</span>
<span>You can lie down</span>
<span>on a towel.</span>
<span>Remember to put sunblock on.</span>
<span>You don't want</span>
<span>your skin to burn.</span>
<span>You can make sandcastles.</span>
<span>Show your creativity!</span>
<span>You can surf</span>
<span>in the water.</span>
<span>Watch out for the big waves!</span>
<span>Finally,</span>
<span>you can watch the sunset.</span>
