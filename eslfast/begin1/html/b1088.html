<span>She is a waitress.</span>
<span>She works at a restaurant.</span>
<span>A customer walks in.</span>
<span>She walks him to a table.</span>
<span>She gives him a menu.</span>
<span>She puts a plate, fork, and spoon</span>
<span>in front of him.</span>
<span>He orders fried chicken.</span>
<span>She smiles.</span>
<span>She is very quick.</span>
<span>She gives him his meal.</span>
<span>He finishes eating.</span>
<span>He gives her a big tip.</span>
