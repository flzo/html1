<div style="font-family: arial; font-size: 2rem;">
<p class="timed vocab all-p" style="text-indent: .35in;">

<span>Everyone knows</span>
<span>that practice makes perfect.</span>
<span>Michelle practices swimming</span>
<span>once every two weeks.</span>
<span>She is not that good.</span>
<span>She gets third place.</span>
<span>Sarah practices</span>
<span>once a week.</span>
<span>She is better</span>
<span>than Michelle.</span>
<span>She gets second place.</span>
<span>Sharon practices</span>
<span>every day.</span>
<span>She is very good.</span>
<span>She gets first place.</span>

</p> </div>
