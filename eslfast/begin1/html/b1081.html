<p class="timed vocab all-p" style="text-indent: .35in;">

<span>He lives in a tall building.</span>
<span>He lives on the 100th floor.</span>
<span>He wakes up.</span>
<span>He looks out the window.</span>
<span>He sees the sun rise.</span>
<span>He sees other buildings.</span>
<span>He sees the mountains.</span>
<span>He looks down.</span>
<span>The people look so small.</span>
<span>The stores look small, too.</span>
<span>What an interesting view!</span>
