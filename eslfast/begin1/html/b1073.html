<div style="font-family: arial; font-size: 2rem;">
<p class="timed vocab all-p" style="text-indent: .35in;">

<span>It is daytime.</span>
<span>The sky is bright blue.</span>
<span>The sun is shining.</span>
<span>There are many clouds</span>
<span>in the sky.</span>
<span>She looks at them.</span>
<span>The clouds</span>
<span>have different shapes.</span>
<span>One of them</span>
<span>looks like a heart.</span>
<span>Another</span>
<span>looks like a bird.</span>
<span>She continues</span>
<span>to look at the clouds.</span>
