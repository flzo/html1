<span>He sees</span>
<span>the sun rise.</span>
<span>He brushes his teeth.</span>
<span>His teeth</span>
<span>are white.</span>
<span>He puts on</span>
<span>his clothes.</span>
<span>His shirt</span>
<span>is blue.</span>
<span>His shoes</span>
<span>are yellow.</span>
<span>His pants</span>

<span>He goes</span>
<span>downstairs.</span>
<span>He gets a bowl.</span>
<span>He pours</span>
<span>milk and cereal.</span>
<span>He eats.</span>
