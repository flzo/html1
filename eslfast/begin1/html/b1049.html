<span>She goes to the library.</span>
<span>She looks at the mystery section.</span>
<span>She takes two books</span>
<span>from the shelf.</span>
<span>She goes</span>
<span>to the romance section.</span>
<span>She does not take any books</span>
<span>from that shelf.</span>
<span>The romance books</span>
<span>seem boring.</span>
<span>She takes</span>
<span>some cooking magazines.</span>
<span>She goes to the checkout desk.</span>
