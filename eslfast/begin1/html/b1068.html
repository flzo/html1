<span>It is time</span>
<span>for the awards ceremony.</span>
<span>She gets the first place medal.</span>
<span>It is circular.</span>
<span>It is gold.</span>
<span>It has a picture</span>
<span>of a ballet dancer.</span>
<span>She deserves the medal.</span>
<span>The audience cheers.</span>
<span>Her parents</span>
<span>scream her name.</span>
<span>Her brother</span>
<span>throws a rose at her.</span>
<span>She bows.</span>
