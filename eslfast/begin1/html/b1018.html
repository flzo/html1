<span>She plays basketball.</span>
<span>The game is intense.</span>
<span>She stares</span>
<span>at her teammate.</span>
<span>Her teammate</span>
<span>passes the ball to her.</span>
<span>She runs</span>
<span>to her team's side of the court.</span>
<span>She dunks the ball</span>
<span>in the basket.</span>
<span>Her team is happy.</span>
<span>They hug her.</span>
<span>They shout her name.</span>

<span>shout,</span>
