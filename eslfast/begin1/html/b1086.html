<p class="timed vocab all-p" style="text-indent: .35in;">

<span>Basketball is about teamwork.</span>
<span>Teammates must be able</span>
<span>to pass the ball.</span>
<span>Robert is far from the hoop.</span>
<span>He passes the ball to Edward.</span>
<span>Edward catches it.</span>
<span>He is far from the hoop, too.</span>
<span>He passes the ball to Mark.</span>
<span>Mark catches it.</span>
<span>Mark is close to the hoop.</span>
<span>He throws the ball in.</span>
<span>It goes in the net!</span>

</p> </div>
