<div style="font-family: arial; font-size: 2rem;">
<p class="timed vocab all-p" style="text-indent: .35in;">

<span>She cannot sleep.</span>
<span>She tries exercising.</span>
<span>She runs three miles</span>
<span>around her house.</span>
<span>She does</span>
<span>100 jumping jacks.</span>
<span>She dances.</span>
<span>She goes back to bed.</span>
<span>She tries to sleep.</span>
<span>She still cannot sleep.</span>
<span>She asks her older sister</span>
<span>what to do.</span>
<span>Her older sister</span>
<span>sings her a lullaby.</span>
<span>She falls asleep.</span>

</p> </div>
