<div style="font-family: arial; font-size: 2rem;">
<p class="timed vocab all-p" style="text-indent: .35in;">

<span>He finishes</span>
<span>watching a scary movie.</span>
<span>His parents tell him</span>
<span>to go to sleep.</span>
<span>He goes into his bed.</span>
<span>He turns off the lights.</span>
<span>He cannot fall asleep.</span>
<span>He keeps thinking about the movie.</span>
<span>He is scared of the dark.</span>
<span>What if a ghost attacks him?</span>
<span>He goes</span>
<span>to his parents' room.</span>
<span>He sleeps there.</span>
