<span>It is raining.</span>
<span>She wears a yellow raincoat.</span>
<span>Her body is warm.</span>
<span>She wears a knitted hat.</span>
<span>Her head is warm.</span>
<span>She wears a gray scarf.</span>
<span>Her neck is warm.</span>
<span>She wears rain boots.</span>
<span>Her feet are warm.</span>
<span>She wears mittens.</span>
