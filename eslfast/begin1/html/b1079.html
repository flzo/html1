<p class="timed vocab all-p" style="text-indent: .35in;">

<span>He goes to his backyard.</span>
<span>He sees something.</span>
<span>It is small and slimy.</span>
<span>It is a lizard!</span>
<span>He puts it on his hand.</span>
<span>He brings it</span>
<span>inside his house.</span>
<span>He shows it</span>
<span>to his parents.</span>
<span>He tells them</span>
<span>he wants to keep it.</span>
<span>They say no.</span>
<span>They say</span>
<span>lizards need to be outside.</span>
<span>He goes to his backyard.</span>
<span>He lets the lizard go.</span>
