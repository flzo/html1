<p class="timed vocab all-p" style="text-indent: .35in;">

<span>She is thirsty.</span>
<span>She gets</span>
<span>a glass of water.</span>
<span>She begins</span>
<span>to walk.</span>
<span>She drops the glass.</span>
<span>There is water</span>
<span>on the floor.</span>
<span>The puddle</span>
<span>is big.</span>
<span>She gets a mop.</span>
<span>She wipes the water off.</span>
<span>The floor is clean.</span>
<span>She gets</span>
<span>another glass of water.</span>
<span>She drinks it.</span>
<span>She is happy.</span>
