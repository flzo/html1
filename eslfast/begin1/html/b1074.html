<span>Summer ends.</span>
<span>Autumn begins.</span>
<span>Autumn is perfect.</span>
<span>It is not too hot</span>
<span>like summer.</span>
<span>It is not too cold</span>
<span>like winter.</span>
<span>She wakes up.</span>
<span>She looks out her window.</span>
<span>The leaves are falling.</span>
<span>Some leaves are orange.</span>
<span>Some leaves are brown.</span>
<span>She sees her dad</span>
<span>raking the leaves.</span>
<span>She goes outside.</span>
<span>She helps her dad.</span>
