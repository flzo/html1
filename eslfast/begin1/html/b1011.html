<p class="timed vocab all-p" style="text-indent: .35in;">

<span>Sandra cannot see.</span>
<span>A bird</span>
<span>looks like a pillow.</span>
<span>A pillow</span>
<span>looks like a marshmallow.</span>
<span>A marshmallow</span>
<span>looks like a tree.</span>
<span>A tree</span>
<span>looks like a bee.</span>
<span>Sandra</span>
<span>goes to a doctor.</span>
<span>The doctor</span>
<span>gives her glasses.</span>
<span>She puts them on.</span>
<span>She can see the doctor.</span>
<span>His eyes</span>
<span>are blue.</span>
<span>Everything</span>
<span>is clear.</span>
