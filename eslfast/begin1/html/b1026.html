<div style="font-family: arial; font-size: 2rem;">
<p class="timed vocab all-p" style="text-indent: .35in;">

<span>He hears a sound</span>
<span>from outside.</span>
<span>He looks out his window.</span>
<span>The newspaper has arrived!</span>
<span>He loves the newspaper.</span>
<span>It's just so interesting.</span>
<span>He reads the cover story.</span>
<span>It is about a homeless man</span>
<span>who won the lottery.</span>
<span>Then,</span>
<span>he looks at the cartoons.</span>
<span>They are so funny.</span>
<span>He loves the newspaper.</span>
