<p class="timed vocab all-p" style="text-indent: .35in;">

<span>Edward is a secretary</span>
<span>in a doctor's office.</span>
<span>He does a lot of things.</span>
<span>He greets patients.</span>
<span>He asks for their information.</span>
<span>He records their height</span>
<span>and weight.</span>
<span>He tells them</span>
<span>how long they have to wait.</span>
<span>He answers phone calls.</span>
<span>He always knows</span>
<span>what to say.</span>
<span>Edward also</span>
<span>keeps the files organized.</span>
