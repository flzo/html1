<p class="timed vocab all-p" style="text-indent: .35in;">

<span>Betty opens up</span>
<span>her present.</span>
<span>It is a snow globe.</span>
<span>She shakes it.</span>
<span>Glitter falls down.</span>
<span>She looks inside the globe.</span>
<span>It is Santa Claus!</span>
<span>He has a white beard</span>
<span>and a big belly.</span>
<span>He has a bag of presents.</span>
<span>He only gives gifts</span>
<span>to good kids.</span>
<span>Betty is a good kid.</span>
<span>She hopes</span>
<span>Santa Claus visits her.</span>
