</head>
<body>

<div style="font-family: arial; font-size: 2rem;">
<p class="timed vocab all-p" style="text-indent: .35in;">

<span>I drive my car.</span>
<span>It suddenly stops.</span>
<span>I go outside</span>
<span>to see what is wrong.</span>
<span>It's a flat tire!</span>
<span>I need to call</span>
<span>a tow truck service,</span>
<span>but I do not have my phone</span>
<span>with me.</span>
<span>I see another car coming.</span>
<span>I ask the driver</span>
<span>if I could borrow his phone.</span>
<span>He says,</span>
<span>"Of course."</span>
<span>What a nice person!</span>

</p> </div>
