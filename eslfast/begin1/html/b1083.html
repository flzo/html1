<div style="font-family: arial; font-size: 2rem;">
<p class="timed vocab all-p" style="text-indent: .35in;">

<span>He has two jackets</span>
<span>with zippers.</span>
<span>One of them</span>
<span>is light blue.</span>
<span>The other one</span>
<span>is brown.</span>
<span>He has two jackets</span>
<span>without zippers.</span>
<span>One of them</span>
<span>has his name</span>
<span>on it.</span>
<span>The other one</span>
<span>has his high school's name</span>
<span>on it.</span>
<span>He has two long jackets.</span>
<span>One of them has buttons.</span>
<span>The other one does not.</span>
<span>He likes all his jackets.</span>

</p> </div>
