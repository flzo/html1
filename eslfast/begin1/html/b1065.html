<p class="timed vocab all-p" style="text-indent: .35in;">

<span>She turns on the TV.</span>
<span>Her favorite TV show</span>
<span>is on.</span>
<span>It is thirty minutes long.</span>
<span>It is about</span>
<span>the slowest animals</span>
<span>on Earth.</span>
<span>She has a slow animal</span>
<span>herself.</span>
<span>It is a turtle!</span>
<span>The turtle</span>
<span>is quiet</span>
<span>and cute.</span>
<span>It is green.</span>
<span>She watches TV</span>
<span>with her turtle.</span>
