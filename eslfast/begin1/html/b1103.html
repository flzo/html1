<span>She is hungry.</span>
<span>She wants an apple.</span>
<span>She walks outside.</span>
<span>She goes to her car.</span>
<span>She drives to the market.</span>
<span>She sees a lot of apples.</span>
<span>The green apples look sour.</span>
<span>The red apples look sweet.</span>
<span>She takes a red apple.</span>
<span>She goes to the cashier.</span>
<span>She gives him money.</span>
<span>She eats the apple.</span>
