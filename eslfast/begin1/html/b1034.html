<span>She jumps</span>
<span>into her bed.</span>
<span>She is ready</span>
<span>to sleep.</span>
<span>She hears a noise.</span>
<span>She looks out her window.</span>
<span>She sees a dog howling.</span>
<span>She goes outside.</span>
<span>The dog is sad.</span>
<span>His owner</span>
<span>does not feed him.</span>
<span>She gets the dog some food.</span>
