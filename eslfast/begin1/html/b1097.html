<p class="timed vocab all-p" style="text-indent: .35in;">

<span>The oven makes a sound.</span>
<span>The apple pie must be ready.</span>
<span>She puts on an oven mitt.</span>
<span>She takes out the pie.</span>
<span>She puts it on the table.</span>
<span>It smells so good.</span>
<span>It looks so good.</span>
<span>It is too hot.</span>
<span>She must let it cool.</span>
<span>She goes up to her room</span>
<span>to wait.</span>
