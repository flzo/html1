<span>She goes to the park.</span>
<span>She sees</span>
<span>a lot of squirrels.</span>
<span>They are small.</span>
<span>They are brown.</span>
<span>They have furry tails.</span>
<span>They run really fast.</span>
<span>They have big eyes.</span>
<span>They are cute.</span>
<span>She goes up</span>
<span>to a squirrel.</span>
<span>She feeds a nut</span>
<span>to the squirrel.</span>
<span>The squirrel takes it,</span>
<span>and runs away.</span>
