<span>She is a maid</span>
<span>for a rich family.</span>
<span>She does a lot of things.</span>
<span>She does the laundry.</span>
<span>She washes the windows.</span>
<span>She cooks meals.</span>
<span>She cleans the tables.</span>
<span>She wipes the floors.</span>
<span>She does not like cleaning.</span>
<span>However,</span>
<span>she likes</span>
<span>taking care of the children.</span>
<span>She reads to them.</span>
