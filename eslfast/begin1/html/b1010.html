<p class="timed vocab all-p" style="text-indent: .35in;">

<span>Linda</span>
<span>loves the park.</span>
<span>There is</span>
<span>so much to do.</span>
<span>First,</span>
<span>she looks at the sky.</span>
<span>One cloud</span>
<span>looks like a dog.</span>
<span>Another cloud</span>
<span>looks like a sheep.</span>
<span>Later,</span>
<span>she feeds the ducks.</span>
<span>They are hungry.</span>
<span>Linda throws bread crumbs.</span>
<span>The ducks enjoy the food.</span>
<span>Finally,</span>
<span>Linda watches the sun</span>
<span>go down.</span>
<span>It is beautiful.</span>
