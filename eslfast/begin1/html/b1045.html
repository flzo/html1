<div style="font-family: arial; font-size: 2rem;">
<p class="timed vocab all-p" style="text-indent: .35in;">

<span>The big bully</span>
<span>enters the cafeteria.</span>
<span>He goes</span>
<span>to the front of the line.</span>
<span>The students</span>
<span>do not say anything.</span>
<span>They are smaller than him.</span>
<span>They are scared.</span>
<span>The lunch lady</span>
<span>sees the bully being mean.</span>
<span>She tells him to get out.</span>
<span>The students cheer</span>
<span>for the lunch lady.</span>

</p> </div>
