<span>High school students</span>
<span>get lockers.</span>
<span>Lockers are awesome.</span>
<span>You can put books</span>
<span>in it.</span>
<span>You can put food</span>
<span>in it.</span>
<span>You can put</span>
<span>a first aid kit</span>
<span>in it.</span>
<span>Thanks to lockers,</span>
<span>you don't have to carry</span>
<span>so much stuff.</span>
<span>You can even</span>
<span>decorate your locker.</span>
<span>You can stick</span>
<span>posters in it.</span>
