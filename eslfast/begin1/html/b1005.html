<span>Sam is a doctor.</span>
<span>He takes care of people.</span>
<span>He smiles at them.</span>
<span>He gives them</span>
<span>medicine.</span>
<span>He gives stickers</span>
<span>to the younger patients.</span>
<span>The younger patients</span>
<span>like him.</span>
<span>They see him</span>
<span>when they are sick.</span>
<span>He makes them feel better.</span>
<span>This makes him happy.</span>
<span>He loves his job.</span>
<span>He goes home proud.</span>
