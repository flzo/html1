<span>She eats a Granola Bar.</span>
<span>She drops a crumb</span>
<span>in the kitchen.</span>
<span>She does not realize it.</span>
<span>She goes to watch a movie.</span>
<span>She comes back</span>
<span>to the kitchen.</span>
<span>She sees many ants.</span>
<span>The ants</span>
<span>are all near the crumb.</span>
<span>She gets a broom.</span>
<span>She sweeps</span>
<span>the ants and the crumb</span>
<span>away.</span>
