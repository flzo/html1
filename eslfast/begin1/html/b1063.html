<p class="timed vocab all-p" style="text-indent: .35in;">

<span>Kimberly walks outside.</span>
<span>She likes</span>
<span>looking at her neighborhood.</span>
<span>She also likes</span>
<span>the fresh air.</span>
<span>She bumps into someone.</span>
<span>She looks at him.</span>
<span>It is an old friend!</span>
<span>He smiles.</span>
<span>He says</span>
<span>he likes the fresh air, too.</span>
<span>They hug.</span>
<span>They talk</span>
<span>about their memories.</span>
<span>They laugh.</span>
