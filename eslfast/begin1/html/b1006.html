<p class="timed vocab all-p" style="text-indent: .35in;">

<span>Jill and Jodi</span>
<span>are twins.</span>
<span>They look the same.</span>
<span>But they act differently.</span>
<span>Jill likes sports.</span>
<span>She is good</span>
<span>at basketball</span>
<span>and golf.</span>
<span>She is also loud.</span>
<span>She talks</span>
<span>all day.</span>
<span>Jodi likes reading.</span>
<span>She can read</span>
<span>300 pages a day.</span>
<span>She is also quiet.</span>
<span>She does not like to talk.</span>
<span>Jill and Jodi</span>
<span>still love each other.</span>
