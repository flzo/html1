<span>She wants</span>
<span>to get across the lake.</span>
<span>She sees a boat.</span>
<span>There is a sailor in it.</span>
<span>The sailor stops the boat.</span>
<span>She gives him some money.</span>
<span>He rows the boat.</span>
<span>She sits in the boat.</span>
<span>It is brown.</span>
<span>It is made of wood.</span>
<span>The boat reaches the other side.</span>
<span>She thanks the sailor.</span>
<span>She gets out.</span>
