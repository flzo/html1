<p class="timed vocab all-p" style="text-indent: .35in;">

<span>She knits a lot of things.</span>
<span>She knits scarves.</span>
<span>She knits hats.</span>
<span>She knits sweaters.</span>
<span>She knits mittens.</span>
<span>She wears what she makes.</span>
<span>She wears them for winter.</span>
<span>She stays warm.</span>
<span>She gives the stuff she knits</span>
<span>to her friends, too.</span>
<span>Her friends love them.</span>
<span>She also sells what she knits.</span>
<span>Her customers buy them.</span>
