<span>He is hungry.</span>
<span>All of the restaurants nearby</span>
<span>are closed.</span>
<span>He finds a vending machine.</span>
<span>There are many snacks inside.</span>
<span>There are drinks, too.</span>
<span>He puts one dollar in.</span>
<span>He wants a bag of chips.</span>
<span>He pushes the button</span>
<span>for the chips.</span>
<span>He puts his hand</span>
<span>in the machine.</span>
<span>He gets his chips.</span>
